<script>
// ===== ui.js =====
/* 鲸鱼娘大战 v2 — UI 模块（SPEC 5.5）
 *
 * 浏览器全局脚本（IIFE），不 import/export，不依赖 DOM，可在 Node 用假 ctx 运行。
 * 对外只挂 WV.UI = { draw(G, ctx), hitTest(mx, my, G) }。
 *
 * 布局（逻辑分辨率 800x600）：
 *   左 600x600 = 游戏区；右 200x600 = HUD（x 600..800）。
 *   静音按钮固定在 canvas 右上角 44x44（x=748..792, y=8..52）。
 *   三选一卡片：150x190，横排居中于游戏区（x=55/225/395, y=205..395）。
 *   「开始 / 再来一局 / 继续」按钮：220x56，命中区均 >= 44px。
 *
 * hitTest 返回 { action, index } 或 null；action 属于：
 *   start / card / restart / mute / resume。
 */
(function (root) {
  'use strict';

  const WV = root.WV = root.WV || {};

  /* ------------------------------------------------------------------ *
   * 调色板与字体（系统字体，零外部资源）
   * ------------------------------------------------------------------ */
  const C = {
    bg: '#061019',
    panel: '#0b1927',
    raised: '#0f2438',
    deep: '#081521',
    text: '#eef6ff',
    dim: '#93a9bf',
    faint: 'rgba(255,255,255,0.34)',
    line: 'rgba(255,255,255,0.11)',
    lineSoft: 'rgba(255,255,255,0.07)',
    accent: '#5ad2ff',
    accent2: '#ffd166',
    green: '#8ce99a',
    danger: '#ff7b8a',
    heart: '#ff8fa8',
    shade: 'rgba(3,9,15,0.82)',
  };
  const FONT = '"Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif';
  const EMOJI_FONT = '"Segoe UI Emoji", "Apple Color Emoji", "Microsoft YaHei", sans-serif';

  /* 三选一卡片尺寸（SPEC：每张 150x190） */
  const CARD_W = 150;
  const CARD_H = 190;
  const CARD_GAP = 20;
  const CARD_TOP = 205;

  /* ------------------------------------------------------------------ *
   * 小工具
   * ------------------------------------------------------------------ */
  function n(v, d) {
    return typeof v === 'number' && isFinite(v) ? v : d;
  }

  function clampInt(v, lo, hi) {
    v = Math.round(n(v, lo));
    return v < lo ? lo : (v > hi ? hi : v);
  }

  function wvNum(key, fallback) {
    const w = root.WV;
    return w && typeof w[key] === 'number' && isFinite(w[key]) ? w[key] : fallback;
  }

  function mapW() { return wvNum('MAP_W', 600); }
  function canvasW() { return wvNum('W', mapW() + wvNum('HUD_W', 200)); }
  function canvasH() { return wvNum('H', 600); }

  function accentOf(G) {
    return G && G.theme && typeof G.theme.accent === 'string' ? G.theme.accent : C.accent;
  }

  function accent2Of(G) {
    return G && G.theme && typeof G.theme.accent2 === 'string' ? G.theme.accent2 : C.accent2;
  }

  function fmtNum(v) {
    const num = Math.max(0, Math.floor(n(v, 0)));
    return String(num);
  }

  function fmtTime(sec) {
    const t = Math.max(0, Math.floor(n(sec, 0)));
    const m = Math.floor(t / 60);
    const s = t % 60;
    return m + ':' + (s < 10 ? '0' + s : String(s));
  }

  function setFont(ctx, size, weight, emoji) {
    ctx.font = (weight ? weight + ' ' : '') + size + 'px ' + (emoji ? EMOJI_FONT : FONT);
  }

  /* ------------------------------------------------------------------ *
   * 形状 / 文本绘制（只用标准 2D API）
   * ------------------------------------------------------------------ */
  function rr(ctx, x, y, w, h, radius) {
    const r = Math.max(0, Math.min(radius, Math.abs(w) / 2, Math.abs(h) / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function hline(ctx, x, y, w, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, 1);
  }

  function textLeft(ctx, s, x, y, size, weight, color) {
    ctx.save();
    setFont(ctx, size, weight, false);
    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(String(s), x, y);
    ctx.restore();
  }

  function textRight(ctx, s, right, y, size, weight, color) {
    const str = String(s);
    ctx.save();
    setFont(ctx, size, weight, false);
    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    const w = ctx.measureText(str).width;
    ctx.fillText(str, right - w, y);
    ctx.restore();
  }

  function centerText(ctx, s, cx, y, size, weight, color) {
    const str = String(s);
    ctx.save();
    setFont(ctx, size, weight, false);
    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    const w = ctx.measureText(str).width;
    ctx.fillText(str, cx - w / 2, y);
    ctx.restore();
  }

  function iconText(ctx, ch, cx, cy, size) {
    const str = String(ch);
    ctx.save();
    setFont(ctx, size, '', true);
    ctx.fillStyle = C.text;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const w = ctx.measureText(str).width;
    ctx.fillText(str, cx - w / 2, cy);
    ctx.restore();
  }

  function wrapText(ctx, s, maxWidth, size) {
    const str = String(s == null ? '' : s);
    const lines = [];
    let cur = '';
    ctx.save();
    setFont(ctx, size, '', false);
    for (let i = 0; i < str.length; i++) {
      const ch = str.charAt(i);
      if (ch === '\n') {
        lines.push(cur);
        cur = '';
        continue;
      }
      const test = cur + ch;
      if (cur && ctx.measureText(test).width > maxWidth) {
        lines.push(cur);
        cur = ch;
      } else {
        cur = test;
      }
    }
    if (cur) lines.push(cur);
    ctx.restore();
    return lines;
  }

  function heart(ctx, cx, cy, s, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.78);
    ctx.bezierCurveTo(cx - s * 1.12, cy + s * 0.02, cx - s * 0.62, cy - s * 0.92, cx, cy - s * 0.30);
    ctx.bezierCurveTo(cx + s * 0.62, cy - s * 0.92, cx + s * 1.12, cy + s * 0.02, cx, cy + s * 0.78);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function wave(ctx, y, amp, color) {
    const MW = mapW();
    const seg = 6;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let i = 0; i < seg; i++) {
      const cxp = MW * (i + 0.5) / seg;
      const nx = MW * (i + 1) / seg;
      ctx.quadraticCurveTo(cxp, y + (i % 2 === 0 ? -amp : amp) * 2, nx, y);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function button(ctx, r, label, opts) {
    opts = opts || {};
    rr(ctx, r.x, r.y, r.w, r.h, 14);
    ctx.fillStyle = opts.bg || 'rgba(90,210,255,0.18)';
    ctx.fill();
    ctx.strokeStyle = opts.stroke || 'rgba(90,210,255,0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();
    centerText(ctx, label, r.x + r.w / 2, r.y + r.h / 2 + (opts.size || 22) * 0.35,
      opts.size || 22, 'bold', opts.color || C.text);
  }

  function panel(ctx, r, fill, stroke, radius) {
    rr(ctx, r.x, r.y, r.w, r.h, radius == null ? 18 : radius);
    ctx.fillStyle = fill;
    ctx.fill();
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  function checkMark(ctx, cx, cy, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 8, cy + 1);
    ctx.lineTo(cx - 2, cy + 7);
    ctx.lineTo(cx + 9, cy - 6);
    ctx.stroke();
    ctx.restore();
  }

  function crossMark(ctx, cx, cy, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 7, cy - 7);
    ctx.lineTo(cx + 7, cy + 7);
    ctx.moveTo(cx + 7, cy - 7);
    ctx.lineTo(cx - 7, cy + 7);
    ctx.stroke();
    ctx.restore();
  }

  /* ------------------------------------------------------------------ *
   * 点击区（draw 与 hitTest 共用同一份几何）
   * ------------------------------------------------------------------ */
  function muteRect() {
    return { x: canvasW() - 8 - 44, y: 8, w: 44, h: 44 };
  }

  function startRect() {
    const MW = mapW();
    return { x: Math.round(MW / 2 - 110), y: 272, w: 220, h: 56 };
  }

  function restartRect() {
    const MW = mapW();
    return { x: Math.round(MW / 2 - 110), y: 396, w: 220, h: 56 };
  }

  function resumeRect() {
    const MW = mapW();
    return { x: Math.round(MW / 2 - 110), y: 292, w: 220, h: 56 };
  }

  function cardRect(index) {
    const MW = mapW();
    const total = CARD_W * 3 + CARD_GAP * 2;
    const x0 = Math.round((MW - total) / 2);
    return {
      x: x0 + index * (CARD_W + CARD_GAP),
      y: CARD_TOP,
      w: CARD_W,
      h: CARD_H,
    };
  }

  function inside(mx, my, r) {
    return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
  }

  /* ------------------------------------------------------------------ *
   * HUD（右侧 200px）
   * ------------------------------------------------------------------ */
  function resolveUpgrade(id) {
    const list = root.WV && root.WV.UPGRADES;
    if (Array.isArray(list)) {
      for (let i = 0; i < list.length; i++) {
        const u = list[i];
        if (u && u.id === id) return u;
      }
    }
    return null;
  }

  function iconOf(id) {
    const u = resolveUpgrade(id);
    return u && u.icon ? u.icon : '★';
  }

  function drawMute(G, ctx) {
    const r = muteRect();
    const muted = !!(G && G.muted);
    rr(ctx, r.x, r.y, r.w, r.h, 10);
    ctx.fillStyle = muted ? '#3a1a24' : '#12293d';
    ctx.fill();
    ctx.strokeStyle = muted ? C.danger : 'rgba(90,210,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    iconText(ctx, muted ? '🔇' : '🔊', r.x + r.w / 2, r.y + r.h / 2 + 1, 21);
  }

  function drawHud(G, ctx) {
    const H = canvasH();
    const x0 = mapW();
    const hudW = canvasW() - x0;
    const pad = 14;
    const ix = x0 + pad;
    const iw = hudW - pad * 2;

    /* 面板底 */
    ctx.fillStyle = C.panel;
    ctx.fillRect(x0, 0, hudW, H);
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.fillRect(x0, 0, hudW, 54);
    ctx.fillStyle = accentOf(G);
    ctx.fillRect(x0, 0, 2, H);
    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    ctx.fillRect(x0 + 2, 0, 2, H);

    /* 顶部：标题小字 + 静音 */
    textLeft(ctx, '鲸鱼娘大战', ix, 31, 14, 'bold', C.text);
    hline(ctx, ix, 46, iw - 52, C.line);
    drawMute(G, ctx);

    /* 关卡 */
    const lv = clampInt(n(G.level, 0), 0, 2);
    textLeft(ctx, '第 ' + (lv + 1) + ' / 3 关', ix, 74, 12, '', accent2Of(G));
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(ix + iw - 6 - (2 - i) * 12, 70, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = i === lv ? accentOf(G) : 'rgba(255,255,255,0.18)';
      ctx.fill();
    }
    const levelName = (G && typeof G.levelName === 'string' && G.levelName) ? G.levelName : '准备中';
    textLeft(ctx, levelName, ix, 101, 19, 'bold', C.text);
    hline(ctx, ix, 114, iw, C.lineSoft);

    /* 剩余敌人 */
    const left = Math.max(0, Math.floor(n(G.enemiesLeft, 0)));
    const total = Math.max(0, Math.floor(n(G.totalEnemies, 0)));
    textLeft(ctx, '剩余敌人', ix, 138, 12, '', C.dim);
    textRight(ctx, left + ' / ' + total, ix + iw, 138, 15, 'bold', C.text);
    rr(ctx, ix, 146, iw, 6, 3);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fill();
    if (total > 0 && left > 0) {
      const ratio = Math.max(0, Math.min(1, left / total));
      rr(ctx, ix, 146, Math.max(6, iw * ratio), 6, 3);
      ctx.fillStyle = left <= 3 ? C.danger : accentOf(G);
      ctx.fill();
    }

    /* 命（心形 x lives） */
    textLeft(ctx, '生命', ix, 176, 12, '', C.dim);
    const lives = Math.max(0, Math.floor(n(G && G.player && G.player.lives, 3)));
    const hearts = Math.min(lives, 8);
    for (let i = 0; i < hearts; i++) {
      heart(ctx, ix + 9 + i * 20, 189, 9, C.heart);
    }
    if (lives === 0) textLeft(ctx, '× 0', ix + 4, 193, 12, '', C.danger);

    /* 分数 */
    textLeft(ctx, '分数', ix, 219, 12, '', C.dim);
    textRight(ctx, fmtNum(G.score), ix + iw, 220, 20, 'bold', accent2Of(G));
    hline(ctx, ix, 233, iw, C.lineSoft);

    /* 已拿强化：最多 8 个，两列 */
    const ups = Array.isArray(G.upgrades) ? G.upgrades.slice(0, 8) : [];
    textLeft(ctx, '已拿强化', ix, 257, 12, '', C.dim);
    textRight(ctx, ups.length + ' / 8', ix + iw, 257, 11, '', C.faint);
    const cellW = (iw - 8) / 2;
    const cellH = 26;
    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 2; col++) {
        const idx = row * 2 + col;
        const cx = ix + col * (cellW + 8);
        const cy = 268 + row * 32;
        rr(ctx, cx, cy, cellW, cellH, 8);
        ctx.fillStyle = idx < ups.length ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.028)';
        ctx.fill();
        if (idx < ups.length) {
          ctx.strokeStyle = 'rgba(90,210,255,0.30)';
          ctx.lineWidth = 1;
          ctx.stroke();
          iconText(ctx, iconOf(ups[idx]), cx + cellW / 2, cy + cellH / 2 + 1, 15);
        }
      }
    }

    /* 底部操作提示 */
    hline(ctx, ix, 500, iw, C.line);
    textLeft(ctx, '方向键/WASD 移动 · 空格 开火', ix, 528, 11, '', C.dim);
    textLeft(ctx, '点右上角静音', ix, 552, 10, '', C.faint);
  }

  /* ------------------------------------------------------------------ *
   * title
   * ------------------------------------------------------------------ */
  function drawRiceBowl(ctx, cx, cy, s) {
    ctx.save();
    /* 蒸汽 */
    ctx.strokeStyle = 'rgba(205,236,255,0.34)';
    ctx.lineWidth = 2;
    for (let i = -1; i <= 1; i++) {
      const bx = cx + i * s * 0.38;
      ctx.beginPath();
      ctx.moveTo(bx, cy - s * 0.52);
      ctx.quadraticCurveTo(bx - 7, cy - s * 0.82, bx, cy - s * 1.10);
      ctx.stroke();
    }
    /* 碗身 */
    ctx.beginPath();
    ctx.moveTo(cx - s, cy);
    ctx.quadraticCurveTo(cx, cy + s * 0.98, cx + s, cy);
    ctx.closePath();
    ctx.fillStyle = '#dfeefc';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.72)';
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 碗口 */
    ctx.beginPath();
    ctx.ellipse(cx, cy, s, s * 0.24, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#f7fbff';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,190,220,0.72)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    /* 米饭堆 */
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.arc(cx + i * s * 0.27, cy - s * 0.08, s * 0.30, Math.PI, Math.PI * 2);
      ctx.fillStyle = i % 2 === 0 ? '#ffffff' : '#f1f8ff';
      ctx.fill();
    }
    ctx.restore();
  }

  function drawTitle(G, ctx) {
    const MW = mapW();
    const H = canvasH();
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, MW, H);

    /* 深海光晕 */
    for (let i = 2; i >= 0; i--) {
      ctx.beginPath();
      ctx.arc(MW / 2, 205, 150 + i * 90, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(90,210,255,' + (0.035 + (2 - i) * 0.022).toFixed(3) + ')';
      ctx.fill();
    }

    /* 水波 */
    for (let k = 0; k < 3; k++) {
      wave(ctx, 522 + k * 26, 10, 'rgba(90,210,255,' + (0.05 + k * 0.035).toFixed(3) + ')');
    }

    /* 气泡 */
    const bubbles = [
      [64, 128, 5], [116, 88, 3], [512, 132, 6], [472, 196, 3.5],
      [88, 300, 4], [534, 330, 5], [168, 388, 3], [420, 372, 4],
    ];
    ctx.strokeStyle = 'rgba(160,220,255,0.22)';
    ctx.lineWidth = 1;
    for (let i = 0; i < bubbles.length; i++) {
      ctx.beginPath();
      ctx.arc(bubbles[i][0], bubbles[i][1], bubbles[i][2], 0, Math.PI * 2);
      ctx.stroke();
    }

    /* 大标题：鲸鱼娘大战 Claude */
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(90,210,255,0.55)';
    ctx.shadowBlur = 20;
    setFont(ctx, 46, 'bold', false);
    const w1 = ctx.measureText('鲸鱼娘大战').width;
    setFont(ctx, 40, 'bold', false);
    const w2 = ctx.measureText('Claude').width;
    const totalW = w1 + 12 + w2;
    let tx = MW / 2 - totalW / 2;
    setFont(ctx, 46, 'bold', false);
    ctx.fillStyle = C.text;
    ctx.fillText('鲸鱼娘大战', tx, 178);
    tx += w1 + 12;
    setFont(ctx, 40, 'bold', false);
    ctx.fillStyle = accentOf(G);
    ctx.fillText('Claude', tx, 178);
    ctx.restore();

    /* 分隔短条 + 副标题 */
    ctx.fillStyle = accent2Of(G);
    ctx.fillRect(MW / 2 - 42, 198, 84, 3);
    centerText(ctx, '3 关 · 5 分钟 · 大白饭保卫战', MW / 2, 232, 18, '', accent2Of(G));

    /* 开始按钮 */
    button(ctx, startRect(), '开始游戏', { size: 22, bg: 'rgba(90,210,255,0.20)' });
    centerText(ctx, '点击任意处开始 · 回车', MW / 2, 358, 13, '', C.dim);

    /* 大白饭 */
    drawRiceBowl(ctx, MW / 2, 458, 50);

    /* 最高分 / 页脚 */
    const best = Math.floor(n(G && G.best, 0));
    if (best > 0) {
      centerText(ctx, '最高分 ' + fmtNum(best), MW / 2, 556, 12, '', 'rgba(255,255,255,0.55)');
    }
    textLeft(ctx, 'WHALE vs CLAUDE', 14, 588, 10, '', 'rgba(255,255,255,0.22)');
    textRight(ctx, 'v2', MW - 14, 588, 10, '', 'rgba(255,255,255,0.22)');
  }

  /* ------------------------------------------------------------------ *
   * intro
   * ------------------------------------------------------------------ */
  function goalOf(G) {
    const lv = clampInt(n(G.level, 0), 0, 2);
    if (lv === 2) {
      return { boss: true, title: 'BOSS 出现', sub: '击破要塞 BOSS，守住大白饭' };
    }
    if (lv === 1) {
      return { boss: false, title: '穿过暗流，清掉所有 Claude 娘', sub: '水边窄道，别被抄后路' };
    }
    return { boss: false, title: '守住大白饭，清掉所有 Claude 娘', sub: '砖墙可以打掉，记得留条退路' };
  }

  function drawIntro(G, ctx) {
    const MW = mapW();
    const H = canvasH();
    const lv = clampInt(n(G.level, 0), 0, 2);
    const goal = goalOf(G);
    const name = (G && typeof G.levelName === 'string' && G.levelName) ? G.levelName : '未知关卡';

    /* 半透明背景（露出后面的战场） */
    ctx.fillStyle = 'rgba(4,11,19,0.64)';
    ctx.fillRect(0, 0, MW, H);

    /* 顶部装饰短条 */
    ctx.fillStyle = accentOf(G);
    ctx.fillRect(MW / 2 - 30, 132, 60, 3);

    const r = { x: 60, y: 150, w: MW - 120, h: 258 };
    panel(ctx, r, 'rgba(10,24,38,0.92)', 'rgba(90,210,255,0.45)');

    centerText(ctx, '第 ' + (lv + 1) + ' 关 · 共 3 关', MW / 2, 196, 13, '', accent2Of(G));
    centerText(ctx, name, MW / 2, 252, 40, 'bold', C.text);

    if (goal.boss) {
      centerText(ctx, goal.title, MW / 2, 300, 28, 'bold', C.danger);
    } else {
      centerText(ctx, goal.title, MW / 2, 298, 17, '', C.text);
    }
    centerText(ctx, goal.sub, MW / 2, 330, 13, '', C.dim);

    /* 关卡进度点 */
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(MW / 2 + (i - 1) * 18, 362, 4, 0, Math.PI * 2);
      ctx.fillStyle = i === lv ? accentOf(G) : 'rgba(255,255,255,0.20)';
      ctx.fill();
    }
    centerText(ctx, '准备出发…', MW / 2, 390, 12, '', C.faint);
  }

  /* ------------------------------------------------------------------ *
   * clear
   * ------------------------------------------------------------------ */
  function drawClear(G, ctx) {
    const MW = mapW();
    const H = canvasH();
    const lv = clampInt(n(G.level, 0), 0, 2);

    ctx.fillStyle = 'rgba(4,11,19,0.56)';
    ctx.fillRect(0, 0, MW, H);

    const r = { x: 90, y: 158, w: MW - 180, h: 252 };
    panel(ctx, r, 'rgba(10,24,38,0.93)', 'rgba(140,233,154,0.45)');

    /* 通过徽章 */
    ctx.beginPath();
    ctx.arc(MW / 2, 196, 18, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(140,233,154,0.14)';
    ctx.fill();
    ctx.strokeStyle = C.green;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    checkMark(ctx, MW / 2, 196, C.green);

    centerText(ctx, '第 ' + (lv + 1) + ' 关 通过', MW / 2, 254, 32, 'bold', accent2Of(G));
    hline(ctx, r.x + 40, 272, r.w - 80, C.line);

    const lx = r.x + 40;
    const rx = r.x + r.w - 40;
    textLeft(ctx, '分数', lx, 306, 13, '', C.dim);
    textRight(ctx, fmtNum(G.score), rx, 306, 20, 'bold', C.text);
    textLeft(ctx, '用时', lx, 338, 13, '', C.dim);
    const used = typeof G.levelTime === 'number' && isFinite(G.levelTime) ? G.levelTime : G.time;
    textRight(ctx, fmtTime(used), rx, 338, 18, 'bold', C.text);

    const hint = lv < 2 ? '接下来：选择一样强化' : '全部关卡完成，正在结算…';
    centerText(ctx, hint, MW / 2, 382, 12, '', C.dim);
  }

  /* ------------------------------------------------------------------ *
   * upgrade（三选一）
   * ------------------------------------------------------------------ */
  function drawCard(ctx, r, card, idx) {
    panel(ctx, r, C.raised, 'rgba(90,210,255,0.45)', 14);
    ctx.fillStyle = C.accent;
    ctx.fillRect(r.x + 16, r.y + 1, r.w - 32, 3);

    /* 序号角标 */
    ctx.beginPath();
    ctx.arc(r.x + 22, r.y + 24, 11, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(90,210,255,0.18)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,210,255,0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();
    centerText(ctx, String(idx + 1), r.x + 22, r.y + 29, 12, 'bold', C.accent);

    /* 图标 */
    const icon = (card && card.icon) ? card.icon : iconOf(card && card.id);
    iconText(ctx, icon, r.x + r.w / 2, r.y + 74, 34);

    /* 名称 */
    const nm = (card && card.name) ? card.name : '强化';
    centerText(ctx, nm, r.x + r.w / 2, r.y + 116, 16, 'bold', C.text);

    /* 描述（自动换行） */
    const desc = (card && card.desc) ? card.desc : '';
    const lines = wrapText(ctx, desc, r.w - 28, 12);
    const startY = r.y + 140;
    for (let i = 0; i < lines.length && i < 3; i++) {
      centerText(ctx, lines[i], r.x + r.w / 2, startY + i * 16, 12, '', C.dim);
    }

    /* 底部装饰 */
    hline(ctx, r.x + 20, r.y + r.h - 14, r.w - 40, 'rgba(90,210,255,0.18)');
  }

  function drawUpgrade(G, ctx) {
    const MW = mapW();
    const H = canvasH();
    const cards = Array.isArray(G.cardChoices) ? G.cardChoices : [];

    ctx.fillStyle = 'rgba(3,9,15,0.80)';
    ctx.fillRect(0, 0, MW, H);

    centerText(ctx, '选择强化', MW / 2, 132, 26, 'bold', C.text);
    centerText(ctx, '本关通过 · 选一样带走', MW / 2, 160, 13, '', C.dim);

    if (cards.length === 0) {
      centerText(ctx, '（等待卡牌数据…）', MW / 2, 300, 14, '', C.faint);
    } else {
      const count = Math.min(cards.length, 3);
      for (let i = 0; i < count; i++) drawCard(ctx, cardRect(i), cards[i], i);
    }

    centerText(ctx, '点击卡片 · 或按 1 / 2 / 3', MW / 2, 440, 12, '', C.faint);
  }

  /* ------------------------------------------------------------------ *
   * result
   * ------------------------------------------------------------------ */
  function drawResult(G, ctx) {
    const MW = mapW();
    const H = canvasH();
    const res = G && G.result ? G.result : {};
    const win = !!res.win;
    const color = win ? C.green : C.danger;

    ctx.fillStyle = C.shade;
    ctx.fillRect(0, 0, MW, H);

    const r = { x: 70, y: 110, w: MW - 140, h: 380 };
    panel(ctx, r, 'rgba(10,24,38,0.95)', win ? 'rgba(140,233,154,0.45)' : 'rgba(255,123,138,0.45)');

    /* 结果徽章 */
    ctx.beginPath();
    ctx.arc(MW / 2, 160, 20, 0, Math.PI * 2);
    ctx.fillStyle = win ? 'rgba(140,233,154,0.14)' : 'rgba(255,123,138,0.14)';
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    if (win) checkMark(ctx, MW / 2, 160, color);
    else crossMark(ctx, MW / 2, 160, color);

    centerText(ctx, win ? '战斗胜利' : '战斗失败', MW / 2, 222, 38, 'bold', color);

    const msg = res && typeof res.msg === 'string' ? res.msg : '';
    if (msg) centerText(ctx, msg, MW / 2, 248, 13, '', C.dim);
    hline(ctx, r.x + 40, 264, r.w - 80, C.line);

    const lx = r.x + 40;
    const rx = r.x + r.w - 40;
    textLeft(ctx, '分数', lx, 296, 13, '', C.dim);
    textRight(ctx, fmtNum(G.score), rx, 296, 19, 'bold', C.text);
    textLeft(ctx, '用时', lx, 328, 13, '', C.dim);
    /* game.js 的 playTime 是真正在战斗里的时间；没有就退回 G.time */
    const used = (typeof G.playTime === 'number' && isFinite(G.playTime)) ? G.playTime : G.time;
    textRight(ctx, fmtTime(used), rx, 328, 17, 'bold', C.text);
    textLeft(ctx, '最高分', lx, 360, 13, '', C.dim);
    textRight(ctx, fmtNum(G.best), rx, 360, 17, 'bold', accent2Of(G));

    button(ctx, restartRect(), '再来一局', { size: 20, bg: 'rgba(90,210,255,0.22)' });
    centerText(ctx, '点击「再来一局」重新出发', MW / 2, 476, 12, '', C.faint);
  }

  /* ------------------------------------------------------------------ *
   * play 时的暂停浮层（提供 resume 点击区）
   * ------------------------------------------------------------------ */
  function drawPause(G, ctx) {
    const MW = mapW();
    const H = canvasH();
    ctx.fillStyle = 'rgba(3,9,15,0.62)';
    ctx.fillRect(0, 0, MW, H);

    const r = { x: 120, y: 200, w: MW - 240, h: 210 };
    panel(ctx, r, 'rgba(10,24,38,0.94)', 'rgba(90,210,255,0.45)');
    centerText(ctx, '暂停', MW / 2, 252, 30, 'bold', C.text);
    centerText(ctx, '点击「继续游戏」回到战斗', MW / 2, 278, 12, '', C.dim);
    button(ctx, resumeRect(), '继续游戏', { size: 20, bg: 'rgba(90,210,255,0.22)' });
    centerText(ctx, '静音请点右上角', MW / 2, 378, 11, '', C.faint);
  }

  /* ------------------------------------------------------------------ *
   * 对外接口
   * ------------------------------------------------------------------ */
  function draw(G, ctx) {
    if (!ctx || typeof ctx.fillRect !== 'function') return;
    G = G || { mode: 'play' };
    const mode = typeof G.mode === 'string' ? G.mode : 'play';

    ctx.save();
    try {
      /* HUD 先画，模式浮层只覆盖左侧游戏区，静音按钮始终可见 */
      drawHud(G, ctx);

      if (mode === 'title') {
        drawTitle(G, ctx);
      } else if (mode === 'intro') {
        drawIntro(G, ctx);
      } else if (mode === 'clear') {
        drawClear(G, ctx);
      } else if (mode === 'upgrade') {
        drawUpgrade(G, ctx);
      } else if (mode === 'result') {
        drawResult(G, ctx);
      } else if (mode === 'play') {
        if (G.paused) drawPause(G, ctx);
      }
    } finally {
      ctx.restore();
    }
  }

  function hitTest(mx, my, G) {
    if (typeof mx !== 'number' || typeof my !== 'number' || !isFinite(mx) || !isFinite(my)) return null;
    G = G || {};

    /* 静音按钮：任何模式都优先命中 */
    if (inside(mx, my, muteRect())) return { action: 'mute', index: -1 };

    const mode = typeof G.mode === 'string' ? G.mode : 'play';

    if (mode === 'title') {
      /* 「点任意处开始」：游戏区内任意位置都算开始，HUD 区不误触 */
      if (mx >= 0 && mx <= mapW() && my >= 0 && my <= canvasH()) return { action: 'start', index: -1 };
      return null;
    }

    if (mode === 'upgrade') {
      const cards = Array.isArray(G.cardChoices) ? G.cardChoices : [];
      const count = Math.min(cards.length, 3);
      for (let i = 0; i < count; i++) {
        if (inside(mx, my, cardRect(i))) return { action: 'card', index: i };
      }
      return null;
    }

    if (mode === 'result') {
      if (inside(mx, my, restartRect())) return { action: 'restart', index: -1 };
      return null;
    }

    if (mode === 'play') {
      if (G.paused) {
        if (inside(mx, my, resumeRect())) return { action: 'resume', index: -1 };
        return null;
      }
      return null;
    }

    /* intro / clear：无交互 */
    return null;
  }

  WV.UI = {
    draw: draw,
    hitTest: hitTest,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ===== game.js =====
// game.js — 状态机 / 主循环 / 子弹 / 波次 / 结算 / 输入
(function (root) {
  'use strict';
  const WV = root.WV = root.WV || {};
  const FIXED = 1 / 60;
  const MAX_ALIVE = 4;

  const hasDOM = typeof document !== 'undefined' && !!document.getElementById('c');
  const canvas = hasDOM ? document.getElementById('c') : null;
  const ctx = canvas ? canvas.getContext('2d') : null;

  const G = {
    mode: 'title', level: 0, levelName: '', theme: null, grid: null,
    dinner: null, spawners: [], playerSpawn: { x: 0, y: 0 }, player: null,
    enemies: [], bullets: [], particles: [], floats: [],
    waveIndex: 0, waveSizes: [], spawnQueue: [], spawnCd: 0, bossPending: false,
    totalEnemies: 0, enemiesLeft: 0, score: 0, kills: 0, playTime: 0,
    upgrades: [], cardChoices: [], boss: null, bossHp: 0, bossMaxHp: 0,
    result: { win: false, msg: '' }, muted: false, hitstop: 0,
    introT: 0, clearT: 0, best: 0, time: 0, levelTime: 0, shakeT: 0,
    dinnerHp: 3, dinnerMaxHp: 3,
  };

  // ---------------- 存档 ----------------
  function readBest() {
    try { return parseInt(root.localStorage && root.localStorage.getItem('wvc-best') || '0', 10) || 0; }
    catch (e) { return 0; }
  }
  function writeBest(v) {
    try { if (root.localStorage) root.localStorage.setItem('wvc-best', String(v)); }
    catch (e) { /* 忽略 */ }
  }
  G.best = readBest();

  // ---------------- 关卡 ----------------
  function loadLevel(i, keepTitle) {
    const lv = WV.Levels[i];
    G.level = i;
    G.levelName = lv.name;
    G.theme = WV.applyTheme(lv.theme);
    G.grid = WV.buildGrid(i);
    WV.grid = G.grid;
    G.dinner = lv.dinner;
    G.spawners = lv.spawners;
    G.playerSpawn = lv.playerSpawn;
    const prevPlayer = G.player;
    G.player = WV.Player.create(G);
    if (prevPlayer) {
      // 跨关保留强化后的属性，位置/无敌由 create 重置
      G.player.lives = prevPlayer.lives;
      G.player.speed = prevPlayer.speed;
      G.player.fireRate = prevPlayer.fireRate;
      G.player.bulletSpeed = prevPlayer.bulletSpeed;
      G.player.bulletPower = prevPlayer.bulletPower;
      G.player.pierce = prevPlayer.pierce;
      G.player.doubleShot = prevPlayer.doubleShot;
      G.player.doubleLevel = prevPlayer.doubleLevel;
      G.player.shieldTime = prevPlayer.shieldTime;
    }
    G.enemies.length = 0;
    G.bullets.length = 0;
    G.particles.length = 0;
    G.floats.length = 0;
    G.waveIndex = 0;
    G.waveSizes = lv.waveSizes.slice();
    G.spawnQueue.length = 0;
    G.spawnCd = 0.8;
    G.bossPending = !!lv.hasBoss;
    G.totalEnemies = lv.enemyQuota + (lv.hasBoss ? 1 : 0);
    G.enemiesLeft = G.totalEnemies;
    G.boss = null;
    G.bossHp = 0;
    G.bossMaxHp = 0;
    G.dinnerHp = 3;
    G.dinnerMaxHp = 3;
    G.levelTime = 0;
    G.shakeT = 0;
    G.hitstop = 0;
    G.mode = keepTitle ? 'title' : 'intro';
    if (!keepTitle) G.introT = 1.9;
  }

  function startGame() {
    dirStack.length = 0;
    WV.input.dir = -1;
    WV.input.fire = false;
    if (WV.Player.touch) { WV.Player.touch.dir = -1; WV.Player.touch.fire = false; }
    G.score = 0;
    G.kills = 0;
    G.playTime = 0;
    G.upgrades = [];
    G.cardChoices = [];
    G.result = { win: false, msg: '' };
    G.player = null;
    loadLevel(0, false);
    WV.audio.play('start');
  }

  // ---------------- 波次 ----------------
  function enemyKindFor(level, idx) {
    const r = WV.rand();
    if (level === 0) return r < 0.7 ? 'grunt' : 'scout';
    if (level === 1) return r < 0.42 ? 'grunt' : r < 0.74 ? 'scout' : 'heavy';
    return r < 0.45 ? 'grunt' : r < 0.85 ? 'heavy' : 'sniper';
  }

  function aliveCap() {
    return G.boss ? 3 : MAX_ALIVE;
  }

  function updateWaves(dt) {
    // 开始下一波
    if (G.spawnQueue.length === 0 && G.waveIndex < G.waveSizes.length) {
      const size = G.waveSizes[G.waveIndex];
      for (let i = 0; i < size; i++) G.spawnQueue.push(enemyKindFor(G.level, i));
      G.waveIndex++;
    }

    // BOSS：最后一波小怪全部刷出后登场
    if (G.bossPending && G.waveIndex >= G.waveSizes.length && G.spawnQueue.length === 0) {
      const p = WV.Enemies.pickSpawn(G);
      WV.Enemies.spawn(G, 'boss', p.x, p.y);
      G.bossPending = false;
      G.boss = G.enemies.find(e => e.isBoss) || null;
      G.bossMaxHp = G.boss ? (G.boss.maxHp || 40) : 0;
      G.bossHp = G.bossMaxHp;
      WV.audio.play('boss');
      WV.FX.float(G, WV.MAP_W / 2, 80, 'Claude 大将军出现！', '#ffd166');
      // 关底补给：BOSS 登场回满命，别让玩家带着残血打最终战
      if (G.player) G.player.lives = 5;
    }

    // 刷小怪
    G.spawnCd -= dt;
    if (G.spawnQueue.length > 0 && G.spawnCd <= 0 && G.enemies.length < aliveCap()) {
      const kind = G.spawnQueue.shift();
      const p = WV.Enemies.pickSpawn(G);
      WV.Enemies.spawn(G, kind, p.x, p.y);
      G.spawnCd = 1.0;
    }
  }

  // ---------------- 玩家受击 / 重生 ----------------
  function respawnPlayer() {
    if (!G.player) return;
    G.player.x = G.playerSpawn.x;
    G.player.y = G.playerSpawn.y;
    G.player.dir = 0;
    G.player.invuln = Math.max(2.5, G.player.invuln || 0);
  }

  function onPlayerHit() {
    if (G.player && G.player.invuln > 0) return;   // 无敌期挨弹不该被传回出生点
    const alive = WV.Player.hit(G);
    if (alive) respawnPlayer();
    else result(false, '鲸鱼娘倒下了…大白饭还在等你');
  }

  // ---------------- 子弹 ----------------
  function removeBullet(i) { G.bullets.splice(i, 1); }

  function bulletHitsTank(b) {
    if (b.owner === 'player') {
      for (const e of G.enemies) {
        if (WV.aabb(b.x - 4, b.y - 4, 8, 8, e.x, e.y, e.w, e.h)) return e;
      }
    } else if (G.player) {
      const p = G.player;
      if (WV.aabb(b.x - 4, b.y - 4, 8, 8, p.x, p.y, p.w, p.h)) return p;
    }
    return null;
  }

  function updateBullets(dt) {
    for (let i = G.bullets.length - 1; i >= 0; i--) {
      const b = G.bullets[i];
      if (!b) continue;
      b.life -= dt;
      if (b.life <= 0) { removeBullet(i); continue; }

      const dist = b.speed * dt;
      const steps = Math.max(1, Math.ceil(dist / 6));
      const stepLen = dist / steps;
      let dead = false;

      for (let s = 0; s < steps && !dead; s++) {
        b.x += b.dx * stepLen;
        b.y += b.dy * stepLen;

        if (b.x < 0 || b.x > WV.MAP_W || b.y < 0 || b.y > WV.MAP_H) { dead = true; break; }

        const t = WV.tileAt(b.x, b.y);
        if (t === WV.DINNER) {
          // 玩家自己的子弹和 BOSS 弹幕都不扣大白饭，只有敌人子弹算数
          if (b.noDinner || b.owner === 'player') continue;
          G.dinnerHp--;
          WV.FX.burst(G, b.x, b.y, '#f6e7c8', 26, 200);
          WV.FX.float(G, b.x, b.y - 20, '大白饭 -1', '#ffb36b');
          WV.audio.play('hit');
          removeBullet(i);
          if (G.dinnerHp <= 0) {
            WV.audio.play('lose');
            result(false, '大白饭被 Claude 吃光了…');
            return;
          }
          dead = true;
          break;
        }
        if (t === WV.BRICK || t === WV.STEEL) {
          // noDinner 的 BOSS 弹幕不拆老巢钢墙，不然破洞后小怪能钻进去偷家
          const res = WV.damageTileAt(b.x, b.y, b.noDinner ? 1 : (b.power || 1));
          if (res.destroyed) {
            WV.FX.burst(G, b.x, b.y, res.type === WV.STEEL ? '#c9d6e2' : '#d98b5f', 10, 140);
          }
          WV.audio.play('ricochet');
          removeBullet(i);
          dead = true;
          break;
        }
        if (t === WV.WATER) continue;

        const target = bulletHitsTank(b);
        if (target) {
          if (b.owner === 'player') {
            const killed = WV.Enemies.damage(G, target, b.dmg || 1);
            WV.FX.burst(G, b.x, b.y, '#ffe9b8', 8, 120);
            if (killed) onEnemyKilled(target);
            else WV.audio.play('hit');
          } else {
            WV.FX.burst(G, b.x, b.y, '#ff9f6b', 10, 130);
            onPlayerHit();
          }
          if (b.pierce && b.pierce > 0) {
            b.pierce--;
            // 沿弹道推出目标身体，避免下一帧重复命中同一个敌人
            b.x += b.dx * 14;
            b.y += b.dy * 14;
          } else {
            removeBullet(i);
          }
          dead = true;
          break;
        }
      }
      if (!dead && (b.x < 0 || b.x > WV.MAP_W || b.y < 0 || b.y > WV.MAP_H)) removeBullet(i);
    }
  }

  // 敌我子弹对撞
  function resolveBulletCollisions() {
    for (let i = G.bullets.length - 1; i >= 0; i--) {
      const a = G.bullets[i];
      if (!a) continue;
      for (let j = i - 1; j >= 0; j--) {
        const b = G.bullets[j];
        if (!b) continue;
        if ((a.owner === 'player') === (b.owner === 'player')) continue;
        if (Math.abs(a.x - b.x) < 10 && Math.abs(a.y - b.y) < 10) {
          WV.FX.burst(G, (a.x + b.x) / 2, (a.y + b.y) / 2, '#fff6dd', 10, 110);
          WV.audio.play('ricochet');
          G.bullets.splice(i, 1);
          G.bullets.splice(j, 1);
          break;
        }
      }
    }
  }

  function onEnemyKilled(e) {
    const idx = G.enemies.indexOf(e);
    if (idx >= 0) G.enemies.splice(idx, 1);
    if (e.isBoss) {
      G.boss = null;
      G.bossHp = 0;
      for (let i = 0; i < 4; i++) {
        WV.FX.burst(G, e.x + e.w / 2 + (i - 1.5) * 14, e.y + e.h / 2, '#ffd166', 22, 240);
      }
      WV.FX.hitstop(G, 0.16);
      WV.audio.play('explode');
      WV.FX.float(G, e.x + e.w / 2, e.y, 'BOSS 击破！', '#ffd166');
    } else {
      WV.FX.burst(G, e.x + e.w / 2, e.y + e.h / 2, '#ff9a5b', 18, 180);
      WV.FX.hitstop(G, 0.05);
      WV.audio.play('kill');
    }
    G.kills++;
    if (!e.summoned) G.enemiesLeft = Math.max(0, G.enemiesLeft - 1);
    G.score += e.score || 100;
    WV.FX.float(G, e.x + e.w / 2, e.y, '+' + (e.score || 100), '#ffe9b8');
  }

  // 玩家和敌人别叠在一起（推开前必须确认目标位置不撞墙，否则会把玩家推进砖里卡死）
  function separatePlayer() {
    const p = G.player;
    if (!p) return;
    for (const e of G.enemies) {
      if (!WV.aabb(p.x, p.y, p.w, p.h, e.x, e.y, e.w, e.h)) continue;
      const pxc = p.x + p.w / 2, pyc = p.y + p.h / 2;
      const exc = e.x + e.w / 2, eyc = e.y + e.h / 2;
      const dx = pxc - exc, dy = pyc - eyc;
      let nx = p.x, ny = p.y;
      if (Math.abs(dx) > Math.abs(dy)) nx += dx > 0 ? 1.2 : -1.2;
      else ny += dy > 0 ? 1.2 : -1.2;
      if (!WV.blockedForTank(nx, ny, p.w, p.h)) { p.x = nx; p.y = ny; }
    }
  }

  // ---------------- 关卡结算 ----------------
  function levelClear() {
    if (G.mode !== 'play') return;
    G.mode = 'clear';
    G.clearT = 2.0;
    G.score += 500;
    if (G.player) G.player.lives = Math.min(5, G.player.lives + 1);
    WV.audio.play('win');
  }

  function checkLevelClear() {
    if (G.waveIndex >= G.waveSizes.length && G.spawnQueue.length === 0 &&
        !G.bossPending && G.enemies.length === 0) levelClear();
  }

  function enterUpgrade() {
    const pool = WV.UPGRADES.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(WV.rand() * (i + 1));
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    G.cardChoices = pool.slice(0, 3).map(u => ({ id: u.id, name: u.name, desc: u.desc, icon: u.icon }));
    G.mode = 'upgrade';
    WV.audio.play('card');
  }

  function chooseCard(i) {
    if (G.mode !== 'upgrade') return;
    const c = G.cardChoices[i];
    if (!c) return;
    WV.Player.applyUpgrade(G, c.id);
    G.upgrades.push(c.id);
    WV.audio.play('powerup');
    G.level++;
    loadLevel(G.level, false);
  }

  function result(win, msg) {
    if (G.mode === 'result') return;
    G.mode = 'result';
    G.result = { win: !!win, msg: msg || (win ? '大白饭守住了！' : '再来一次吧') };
    if (win) {
      G.score += 1000;
      if (G.score > G.best) { G.best = G.score; writeBest(G.best); }
      WV.audio.play('win');
    } else {
      if (G.score > G.best) { G.best = G.score; writeBest(G.best); }
      WV.audio.play('lose');
    }
  }

  // ---------------- 输入 ----------------
  const dirStack = [];
  const keyDir = {
    ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1,
    ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3,
  };

  function syncDir() {
    WV.input.dir = dirStack.length ? dirStack[dirStack.length - 1] : -1;
  }

  function onKeyDown(e) {
    if (e.repeat) return;
    if (WV.audio && WV.audio.init) WV.audio.init();
    const d = keyDir[e.code];
    if (d !== undefined) {
      if (!dirStack.includes(d)) dirStack.push(d);
      syncDir();
      e.preventDefault();
      return;
    }
    if (e.code === 'Space' || e.code === 'KeyJ') {
      WV.input.fire = true;
      e.preventDefault();
      if (G.mode === 'title') startGame();
      else if (G.mode === 'result') startGame();
      return;
    }
    if (e.code === 'Enter') {
      if (G.mode === 'title' || G.mode === 'result') startGame();
      return;
    }
    if (e.code === 'KeyM') { toggleMute(); return; }
    if (G.mode === 'upgrade') {
      if (e.code === 'Digit1' || e.code === 'Numpad1') chooseCard(0);
      else if (e.code === 'Digit2' || e.code === 'Numpad2') chooseCard(1);
      else if (e.code === 'Digit3' || e.code === 'Numpad3') chooseCard(2);
    }
  }

  function onKeyUp(e) {
    if (e.code === 'Space' || e.code === 'KeyJ') { WV.input.fire = false; return; }
    const d = keyDir[e.code];
    if (d !== undefined) {
      const i = dirStack.indexOf(d);
      if (i >= 0) dirStack.splice(i, 1);
      syncDir();
    }
  }

  function toggleMute() {
    if (WV.audio && WV.audio.toggle) WV.audio.toggle();
    G.muted = WV.audio ? !!WV.audio.muted : false;
  }

  function toCanvas(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (WV.W / r.width),
      y: (e.clientY - r.top) * (WV.H / r.height),
    };
  }

  function onPointerDown(e) {
    if (WV.audio && WV.audio.init) WV.audio.init();
    const p = toCanvas(e);
    const hit = WV.UI.hitTest(p.x, p.y, G);
    if (hit && hit.action === 'mute') { toggleMute(); return; }
    if (!hit) return;
    if (hit.action === 'start') { startGame(); return; }
    if (hit.action === 'restart') { startGame(); return; }
    if (hit.action === 'card') { chooseCard(hit.index); return; }
  }

  // ---------------- 主循环 ----------------
  let acc = 0, last = 0;

  function step(dt) {
    G.time += dt;
    if (G.hitstop > 0) { G.hitstop -= dt; return; }

    if (G.mode === 'intro') {
      G.introT -= dt;
      if (G.introT <= 0) G.mode = 'play';
      return;
    }
    if (G.mode === 'play') {
      G.levelTime += dt;
      G.playTime += dt;
      WV.Player.update(G, dt);
      WV.Enemies.update(G, dt);
      updateBullets(dt);
      resolveBulletCollisions();
      separatePlayer();
      WV.FX.update(G, dt);
      updateWaves(dt);
      // 同步 Boss 血量
      if (G.boss && !G.enemies.includes(G.boss)) G.boss = null;
      if (G.boss) G.bossHp = Math.max(0, G.boss.hp);
      checkLevelClear();
      return;
    }
    if (G.mode === 'clear') {
      G.clearT -= dt;
      WV.FX.update(G, dt);
      if (G.clearT <= 0) {
        if (G.level < WV.Levels.length - 1) enterUpgrade();
        else result(true, '三关全破，大白饭守住了！');
      }
      return;
    }
    WV.FX.update(G, dt);
  }

  function drawTankFlash(e) {
    if (!e.flash || e.flash <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.min(0.85, e.flash * 4);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(e.x + e.w / 2, e.y + e.h / 2, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBullets() {
    for (const b of G.bullets) {
      WV.drawRiceBall(ctx, b, b.owner === 'player' ? '#fffdf5' : '#ffe0c2');
    }
  }

  // 大白饭血量：老巢上方三颗小饭团
  function drawDinnerHp() {
    if (!G.dinner || G.mode === 'title') return;
    const x0 = G.dinner.x + G.dinner.w / 2 - 22;
    const y0 = G.dinner.y - 14;
    for (let i = 0; i < G.dinnerMaxHp; i++) {
      ctx.save();
      ctx.globalAlpha = i < G.dinnerHp ? 1 : 0.22;
      ctx.fillStyle = '#fffdf5';
      ctx.beginPath();
      ctx.arc(x0 + i * 22, y0, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#7a5a3a';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawBossBar() {
    if (!G.boss || G.bossMaxHp <= 0) return;
    const w = 320, x = WV.MAP_W / 2 - w / 2, y = 14;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    WV.roundRect(ctx, x - 4, y - 4, w + 8, 24, 6); ctx.fill();
    ctx.fillStyle = '#5a2c18';
    WV.roundRect(ctx, x, y, w, 16, 5); ctx.fill();
    ctx.fillStyle = '#ff8a4c';
    WV.roundRect(ctx, x, y, w * (G.bossHp / G.bossMaxHp), 16, 5); ctx.fill();
    ctx.fillStyle = '#fff3e0';
    ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Claude 大将军  ' + Math.ceil(G.bossHp) + '/' + G.bossMaxHp, WV.MAP_W / 2, y + 13);
    ctx.restore();
  }

  function render() {
    if (!ctx) return;
    ctx.clearRect(0, 0, WV.W, WV.H);
    ctx.fillStyle = '#07101a';
    ctx.fillRect(0, 0, WV.W, WV.H);

    if (!G.grid) return;

    // 地图
    WV.drawTiles(G, ctx, G.time);

    // 子弹
    drawBullets();

    // 敌人
    for (const e of G.enemies) {
      const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
      if (e.isBoss) {
        // BOSS 专属表现：金底光 + 1.35 倍体型，跟杂兵一眼分得开
        ctx.save();
        ctx.globalAlpha = 0.42;
        const grd = ctx.createRadialGradient(cx, cy, 8, cx, cy, 42);
        grd.addColorStop(0, '#ffd166');
        grd.addColorStop(1, 'rgba(255,209,102,0)');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(cx, cy, 42, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1.35, 1.35);
        WV.drawCharacter('claude', 0, 0, e.dir, 1, ctx);
        ctx.restore();
      } else {
        WV.drawCharacter('claude', cx, cy, e.dir, 1, ctx);
      }
      drawTankFlash(e);
      if (e.isBoss) {
        ctx.save();
        ctx.strokeStyle = '#ffd166';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(e.x + e.w / 2, e.y + e.h / 2, 22, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 玩家
    if (G.player) {
      let alpha = 1;
      if (G.player.invuln > 0 && Math.floor(G.time * 20) % 2 === 0) alpha = 0.45;
      WV.drawCharacter('player', G.player.x + G.player.w / 2, G.player.y + G.player.h / 2, G.player.dir, alpha, ctx);
      if (G.player.shieldTime > 0) {
        ctx.save();
        ctx.strokeStyle = 'rgba(140,220,255,.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(G.player.x + G.player.w / 2, G.player.y + G.player.h / 2, 23, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 粒子/飘字
    WV.FX.draw(G, ctx);
    drawBossBar();
    drawDinnerHp();

    // UI
    WV.UI.draw(G, ctx);
  }

  function loop(ts) {
    if (!last) last = ts;
    const dt = Math.min(0.1, (ts - last) / 1000);
    last = ts;
    acc += dt;
    let guard = 0;
    while (acc >= FIXED && guard < 6) {
      step(FIXED);
      acc -= FIXED;
      guard++;
    }
    render();
    root.requestAnimationFrame(loop);
  }

  // ---------------- 初始化 ----------------
  function init() {
    if (canvas) { canvas.width = WV.W; canvas.height = WV.H; }
    loadLevel(0, true);
    WV.loadSprites();
    if (WV.Player.attachTouch) WV.Player.attachTouch(G);
    G.muted = WV.audio ? !!WV.audio.muted : false;
    if (hasDOM) {
      root.addEventListener('keydown', onKeyDown);
      root.addEventListener('keyup', onKeyUp);
      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('contextmenu', e => e.preventDefault());   // 手机长按不弹菜单
      // 测试/截图用：?play=1 跳过标题直接开局；?level=2 从第 3 关起
      try {
        const q = new URLSearchParams(root.location.search);
        if (q.has('play')) {
          startGame();
          if (q.has('level')) {
            const lv = Math.max(0, Math.min(WV.Levels.length - 1, parseInt(q.get('level'), 10) || 0));
            loadLevel(lv, false);
            G.mode = 'play';
          }
        }
        // 截图用：?boss=1 直接跳到 BOSS 波（跳过小怪），用于验收 BOSS 画面
        if (q.has('boss')) {
          G.spawnQueue.length = 0;
          G.enemies.length = 0;
          G.waveIndex = G.waveSizes.length;
          G.bossPending = true;
          G.enemiesLeft = 1;
          G.boss = null;
          if (G.player) G.player.invuln = 99999;
          step(FIXED); // 让 updateWaves 生成 BOSS
          render();
        }
        // 截图用：?tick=600 先跑 10 秒逻辑再画一帧，能拍到敌人/子弹/BOSS
        if (q.has('tick')) {
          const n = Math.max(0, Math.min(7200, parseInt(q.get('tick'), 10) || 0));
          const wantGod = q.has('god');
          const wantFire = q.has('fire');
          for (let i = 0; i < n; i++) {
            if (wantGod && G.player) G.player.invuln = 99999;
            if (wantFire) WV.input.fire = true;
            step(FIXED);
          }
          if (q.has('dir') && G.player) G.player.dir = Math.max(0, Math.min(3, parseInt(q.get('dir'), 10) || 0));
          render();
        }
      } catch (e) { /* file:// 下也应有 location */ }
      root.requestAnimationFrame(loop);
    }
  }

  // ---------------- 测试钩子 ----------------
  root.__WV = {
    G,
    step,
    render,
    init,
    start: startGame,
    chooseCard,
    restart: startGame,
    tick(n) { for (let i = 0; i < n; i++) step(FIXED); return G; },
    state() {
      return {
        mode: G.mode, level: G.level, score: G.score, kills: G.kills,
        enemies: G.enemies.length, enemiesLeft: G.enemiesLeft, lives: G.player ? G.player.lives : 0,
        waveIndex: G.waveIndex, queue: G.spawnQueue.length, bossHp: G.boss ? G.boss.hp : 0,
        playTime: G.playTime, upgrades: G.upgrades.slice(), result: G.result,
      };
    },
    setInput(dir, fire) { WV.input.dir = dir; WV.input.fire = !!fire; },
    forceCard(i) { if (G.mode === 'upgrade') chooseCard(i); },
    god(bool) { if (G.player) G.player.invuln = bool ? 99999 : 0; },
    jump(n) { G.player = null; loadLevel(n, false); G.mode = 'play'; },
  };

  if (hasDOM) init();

})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
