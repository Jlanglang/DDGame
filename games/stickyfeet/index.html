<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>黏脚走路原型</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #c6ecff;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #hud {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #4a382c;
      user-select: none;
      pointer-events: none;
    }
    #tip, #stretch {
      margin: 0;
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.62);
      font-size: 14px;
      line-height: 1.4;
    }
    #bar {
      width: 220px;
      height: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.55);
      overflow: hidden;
    }
    #barFill {
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: #e07a4c;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: auto;
    }
    button {
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: #5a4636;
      font: 16px/1 "Microsoft YaHei", "PingFang SC", sans-serif;
      cursor: pointer;
    }
    button.on {
      background: #e07a4c;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="hud">
    <p id="tip">点小岛走路，或按 WASD。1 / 2 / 3 切换抬脚早晚。</p>
    <p id="stretch">后腿还没拉开</p>
    <div id="bar"><div id="barFill"></div></div>
    <div class="row">
      <button type="button" id="p0">普通</button>
      <button type="button" id="p1">黏脚</button>
      <button type="button" id="p2">太黏</button>
    </div>
  </div>
  <!-- three.js r160.1 MIT -->
  <script src="vendor/three.min.js"></script>
  <script src="main.js?v=2"></script>
</body>
</html>
