<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>鲸鱼娘大战 Claude · 3关BOSS版</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #07101a;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  canvas {
    display: block; max-width: 100vw; max-height: 100vh;
    touch-action: none; box-shadow: 0 10px 50px rgba(0, 0, 0, .65);
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== core.js =====
// core.js — 常量 / 工具 / 地形碰撞 / 贴图 / 地形渲染
(function (root) {
  'use strict';
  const WV = root.WV = root.WV || {};

  // ---------- 尺寸 ----------
  WV.TILE = 40;
  WV.COLS = 15;
  WV.ROWS = 15;
  WV.MAP_W = WV.TILE * WV.COLS;   // 600
  WV.MAP_H = WV.TILE * WV.ROWS;   // 600
  WV.HUD_W = 200;
  WV.W = WV.MAP_W + WV.HUD_W;     // 800
  WV.H = WV.MAP_H;                // 600

  // ---------- 地形 ----------
  WV.EMPTY = 0;
  WV.BRICK = 1;
  WV.STEEL = 2;
  WV.DINNER = 3;
  WV.WATER = 4;

  // 0 上 / 1 右 / 2 下 / 3 左
  WV.DX = [0, 1, 0, -1];
  WV.DY = [-1, 0, 1, 0];

  WV.rand = Math.random;
  WV.grid = null;              // game.js 每关同步
  WV.input = { dir: -1, fire: false, firePressed: false };

  // ---------- 工具 ----------
  WV.clamp = function (v, min, max) { return v < min ? min : v > max ? max : v; };

  WV.aabb = function (ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  };

  WV.tileAt = function (px, py) {
    if (!WV.grid) return -1;
    const c = Math.floor(px / WV.TILE), r = Math.floor(py / WV.TILE);
    if (c < 0 || r < 0 || c >= WV.COLS || r >= WV.ROWS) return -1;
    return WV.grid[r][c];
  };

  // 坦克能不能站在这个矩形：砖/钢/老巢/水/出界都挡
  WV.blockedForTank = function (x, y, w, h) {
    const c0 = Math.floor(x / WV.TILE), c1 = Math.floor((x + w - 1) / WV.TILE);
    const r0 = Math.floor(y / WV.TILE), r1 = Math.floor((y + h - 1) / WV.TILE);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        if (c < 0 || r < 0 || c >= WV.COLS || r >= WV.ROWS) return true;
        const t = WV.grid[r][c];
        if (t !== WV.EMPTY) return true;
      }
    }
    return false;
  };

  // 子弹打在地形上：砖 power>=1 破，钢 power>=2 破
  WV.damageTileAt = function (px, py, power) {
    if (!WV.grid) return { type: -1, destroyed: false };
    const c = Math.floor(px / WV.TILE), r = Math.floor(py / WV.TILE);
    if (c < 0 || r < 0 || c >= WV.COLS || r >= WV.ROWS) return { type: -1, destroyed: false };
    const t = WV.grid[r][c];
    if (t === WV.BRICK && power >= 1) { WV.grid[r][c] = WV.EMPTY; return { type: t, destroyed: true }; }
    if (t === WV.STEEL && power >= 2) { WV.grid[r][c] = WV.EMPTY; return { type: t, destroyed: true }; }
    return { type: t, destroyed: false };
  };

  // ---------- 角色贴图 ----------
  const SPRITE_S = 36, SPRITE_PX = 2;   // 比碰撞盒(34)略大一点，但不再 40px 叠脸
  WV.SPRITE_FILES = {
    player: ['whale-girl-up.png', 'whale-girl-side-r.png', 'whale-girl.png', 'whale-girl-side.png'],
    claude: ['claude-buddy-up.png', 'claude-buddy-side.png', 'claude-buddy.png', 'claude-buddy-side-l.png'],
  };
  WV.assets = { player: [], claude: [] };
  const fallbackSprites = {};

  function pixelTank(kind) {
    const c = document.createElement('canvas');
    c.width = 34; c.height = 34;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    const rect = (x, y, w, h, color) => {
      g.fillStyle = color;
      g.fillRect(x * SPRITE_PX, y * SPRITE_PX, w * SPRITE_PX, h * SPRITE_PX);
    };
    const C = kind === 'player'
      ? { track: '#1b3f5c', trackDark: '#0e2438', body: '#2f8fd8', bodyDark: '#1b5f9e', belly: '#d9f1ff', barrel: '#e9f8ff', turret: '#9fd8ff', eye: '#08283f' }
      : { track: '#7a3b1f', trackDark: '#4d2412', body: '#d97742', bodyDark: '#a5522a', belly: '#f7ddc2', barrel: '#f2b78e', turret: '#f7ddc2', eye: '#7a2f12' };

    rect(2, 3, 3, 11, C.track);
    rect(12, 3, 3, 11, C.track);
    for (let y = 3; y < 14; y += 2) {
      rect(2, y, 3, 1, C.trackDark);
      rect(12, y, 3, 1, C.trackDark);
    }
    rect(5, 3, 7, 11, C.body);
    rect(5, 3, 7, 1, C.bodyDark);
    rect(8, 0, 1, 4, C.barrel);
    rect(8, 0, 1, 1, '#ffffff');
    rect(7, 6, 3, 4, C.turret);
    if (kind === 'player') {
      rect(7, 7, 1, 1, C.eye);
      rect(9, 7, 1, 1, C.eye);
      rect(6, 14, 2, 2, C.bodyDark);
      rect(9, 14, 2, 2, C.bodyDark);
      rect(7, 15, 3, 1, C.belly);
    } else {
      rect(8, 7, 1, 3, '#c2572a');
      rect(7, 8, 3, 1, '#c2572a');
    }
    return c;
  }

  // 预渲染成 40×40 离屏 canvas；Node 下不执行
  WV.loadSprites = function () {
    if (typeof document === 'undefined') return;
    for (const kind in WV.SPRITE_FILES) {
      fallbackSprites[kind] = pixelTank(kind);
      WV.assets[kind] = [];
      WV.SPRITE_FILES[kind].forEach((file, dir) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = SPRITE_S; c.height = SPRITE_S;
          const g = c.getContext('2d');
          g.imageSmoothingEnabled = true;
          g.drawImage(img, 0, 0, SPRITE_S, SPRITE_S);
          WV.assets[kind][dir] = c;
        };
        img.onerror = () => { /* 用后备像素图 */ };
        img.src = file;
      });
    }
  };

  WV.drawCharacter = function (kind, cx, cy, dir, alpha, ctx) {
    const c = ctx || (typeof document !== 'undefined' ? root.document.getElementById('c').getContext('2d') : null);
    if (!c) return;
    const img = (WV.assets[kind] && WV.assets[kind][dir]) || fallbackSprites[kind] || (WV.assets[kind] && WV.assets[kind][2]);
    if (!img) return;
    c.save();
    if (alpha !== undefined && alpha < 1) c.globalAlpha = alpha;
    c.drawImage(img, Math.round(cx - SPRITE_S / 2), Math.round(cy - SPRITE_S / 2), SPRITE_S, SPRITE_S);
    c.restore();
  };

  // 主题色兜底：关卡只给部分字段也能画
  WV.applyTheme = function (theme) {
    const t = theme || {};
    const bg = t.bg || '#0a1a26';
    return {
      bg0: t.bg0 || bg,
      bg1: t.bg1 || '#050d15',
      brick: t.brick || '#c97b4a',
      brickDark: t.brickDark || '#8a4f2c',
      steel: t.steel || '#9fb3c8',
      steelDark: t.steelDark || '#5d7186',
      water: t.water || '#1e5f8a',
      waterHi: t.waterHi || '#4da3d1',
      accent: t.accent || '#7fd6ff',
      accent2: t.accent2 || '#ffd166',
    };
  };

  // ---------- 地形渲染 ----------
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  WV.roundRect = roundRect;

  function drawBrick(ctx, x, y, th) {
    ctx.fillStyle = th.brickDark;
    ctx.fillRect(x, y, WV.TILE, WV.TILE);
    ctx.fillStyle = th.brick;
    const bw = 19, bh = 9;
    for (let row = 0; row < 4; row++) {
      const off = (row % 2) * 10;
      for (let col = -1; col < 2; col++) {
        ctx.fillRect(x + col * 20 + off + 1, y + row * 10 + 1, bw - 2, bh - 2);
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(x, y, WV.TILE, 1);
  }

  function drawSteel(ctx, x, y, th) {
    ctx.fillStyle = th.steel;
    ctx.fillRect(x, y, WV.TILE, WV.TILE);
    ctx.fillStyle = th.steelDark;
    ctx.fillRect(x + 2, y + 2, WV.TILE - 4, WV.TILE - 4);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fillRect(x + 2, y + 2, WV.TILE - 4, 2);
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    const r = 2;
    for (let i = 0; i < 2; i++) {
      for (let j = 0; j < 2; j++) {
        ctx.beginPath();
        ctx.arc(x + 9 + i * 22, y + 9 + j * 22, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawWater(ctx, x, y, th, time) {
    ctx.fillStyle = th.water;
    ctx.fillRect(x, y, WV.TILE, WV.TILE);
    ctx.strokeStyle = th.waterHi;
    ctx.lineWidth = 2;
    for (let i = 0; i < 2; i++) {
      const yy = y + 12 + i * 16 + Math.sin(time * 2 + (x + y) * 0.02 + i) * 2;
      ctx.beginPath();
      ctx.moveTo(x + 4, yy);
      ctx.quadraticCurveTo(x + 20, yy + 4, x + 36, yy);
      ctx.stroke();
    }
  }

  function drawDinnerTile(ctx, x, y, th) {
    // 单独一格的大白饭块，四格拼成 2×2 老巢
    ctx.fillStyle = '#e8f4ff';
    roundRect(ctx, x + 1, y + 1, WV.TILE - 2, WV.TILE - 2, 8);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x + WV.TILE / 2, y + WV.TILE / 2 - 2, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.06)';
    ctx.beginPath();
    ctx.arc(x + WV.TILE / 2, y + WV.TILE / 2 + 2, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // 整张地图：背景 + 地形 + 老巢蒸汽
  WV.drawTiles = function (G, ctx, time) {
    const th = G.theme;
    // 背景
    const bg = ctx.createLinearGradient(0, 0, 0, WV.MAP_H);
    bg.addColorStop(0, th.bg0);
    bg.addColorStop(1, th.bg1);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, WV.MAP_W, WV.MAP_H);

    // 细网格（很淡）
    ctx.strokeStyle = 'rgba(255,255,255,.035)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= WV.COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * WV.TILE, 0); ctx.lineTo(i * WV.TILE, WV.MAP_H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * WV.TILE); ctx.lineTo(WV.MAP_W, i * WV.TILE); ctx.stroke();
    }

    for (let r = 0; r < WV.ROWS; r++) {
      for (let c = 0; c < WV.COLS; c++) {
        const t = G.grid[r][c];
        const x = c * WV.TILE, y = r * WV.TILE;
        if (t === WV.BRICK) drawBrick(ctx, x, y, th);
        else if (t === WV.STEEL) drawSteel(ctx, x, y, th);
        else if (t === WV.WATER) drawWater(ctx, x, y, th, time);
        else if (t === WV.DINNER) drawDinnerTile(ctx, x, y, th);
      }
    }

    // 老巢蒸汽：从 2×2 中心往上
    if (G.dinner) {
      const cx = G.dinner.x + G.dinner.w / 2;
      const cy = G.dinner.y + G.dinner.h / 2;
      ctx.save();
      ctx.globalAlpha = 0.35;
      for (let i = 0; i < 3; i++) {
        const p = (time * 0.55 + i / 3) % 1;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx + Math.sin((time + i) * 2) * 4, cy - 26 - p * 34, 5 + p * 6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      // 老巢轮廓
      ctx.strokeStyle = th.accent;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.5;
      roundRect(ctx, G.dinner.x - 2, G.dinner.y - 2, G.dinner.w + 4, G.dinner.h + 4, 10);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  };

  // 饭团子弹（旋转指向飞行方向）
  WV.drawRiceBall = function (ctx, b, color) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.dy, b.dx) + Math.PI / 2);   // 尖端朝飞行方向（形状默认朝上）
    ctx.fillStyle = color || '#fffdf5';
    ctx.beginPath();
    ctx.moveTo(0, -7);
    ctx.quadraticCurveTo(7, 2, 5, 7);
    ctx.lineTo(-5, 7);
    ctx.quadraticCurveTo(-7, 2, 0, -7);
    ctx.fill();
    ctx.fillStyle = '#22303a';
    ctx.fillRect(-4, 2, 8, 4);
    ctx.restore();
  };

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ===== level.js =====
/* =============================================================
 * 鲸鱼娘大战 Claude v2 — src/level.js
 * 关卡数据 + 网格构建。契约见 SPEC-v2.md 5.1。
 * 浏览器全局脚本（IIFE），不 import/export，不依赖 DOM，
 * 可在 Node 里直接加载：globalThis.WV.Levels / globalThis.WV.buildGrid。
 * ============================================================= */
(function (root) {
  'use strict';

  const WV = root.WV = root.WV || {};

  /* ---- core.js 常量的本地镜像（保证本文件可单独加载） ---- */
  const TILE = 40;
  const COLS = 15;
  const ROWS = 15;
  const EMPTY = 0;   // '.'
  const BRICK = 1;   // 'b'
  const STEEL = 2;   // 's'
  const DINNER = 3;  // 'H' 老巢（大白饭）
  const WATER = 4;   // 'w'

  const CHAR_TILE = { '.': EMPTY, b: BRICK, s: STEEL, H: DINNER, w: WATER };

  /* ---- 固定布局：老巢 2x2（col 7-8 / row 13-14），四周砖 ---- */
  const DINNER_COL = 7;
  const DINNER_ROW = 13;

  const DINNER_PIXEL = {
    x: DINNER_COL * TILE,          // 280
    y: DINNER_ROW * TILE,          // 520
    w: TILE * 2,                   // 80
    h: TILE * 2                    // 80
  };

  // 玩家出生点：老巢左侧 col 5 / row 13，34x34 坦克居中留 3px 余量
  const PLAYER_SPAWN = { x: 5 * TILE + 3, y: 13 * TILE + 3 };  // {203, 523}

  // 三个敌人出生点：顶部 左(col 0) / 中(col 7) / 右(col 13)
  const SPAWNERS = [
    { x: 0 * TILE + 3, y: 3 },     // {3, 3}
    { x: 7 * TILE + 3, y: 3 },     // {283, 3}
    { x: 13 * TILE + 3, y: 3 }     // {523, 3}
  ];

  function px(col, row, inset) {
    const k = inset == null ? 3 : inset;
    return { x: col * TILE + k, y: row * TILE + k };
  }
  // 保持 spawn 数据与地图一致，避免手抄坐标漂移（结果与上面常量一致）
  if (PLAYER_SPAWN.x !== px(5, 13).x || PLAYER_SPAWN.y !== px(5, 13).y) {
    PLAYER_SPAWN.x = px(5, 13).x;
    PLAYER_SPAWN.y = px(5, 13).y;
  }

  /* ============================ 第 1 关 ============================
   * 「浅滩」：开阔、砖块稀疏，一屏看懂。12 敌 / 3 波。
   * ============================================================== */
  const LEVEL_1 = {
    id: 1,
    name: '浅滩',
    desc: '开阔浅滩，砖墙稀疏，先热热身。',
    theme: {
      bg: '#0d2b2b',
      brick: '#c97b4a',
      steel: '#9fb0ba',
      water: '#2a7fa8',
      accent: '#5fe3b6',
      accent2: '#ffd166'
    },
    map: [
      '...............',
      '..bb.......bb..',
      '..bb.......bb..',
      '...............',
      '....bb...bb....',
      '....bb...bb....',
      '...............',
      '..bb..bbb..bb..',
      '...............',
      '....bb...bb....',
      '....bb...bb....',
      '...............',
      '......ssss.....',
      '......sHHs.....',
      '......sHHs.....'
    ],
    enemyQuota: 24,
    waveSizes: [4, 4, 4, 4, 4, 4],
    hasBoss: false,
    playerSpawn: { x: PLAYER_SPAWN.x, y: PLAYER_SPAWN.y },
    dinner: { x: DINNER_PIXEL.x, y: DINNER_PIXEL.y, w: DINNER_PIXEL.w, h: DINNER_PIXEL.h },
    spawners: [
      { x: SPAWNERS[0].x, y: SPAWNERS[0].y },
      { x: SPAWNERS[1].x, y: SPAWNERS[1].y },
      { x: SPAWNERS[2].x, y: SPAWNERS[2].y }
    ]
  };

  /* ============================ 第 2 关 ============================
   * 「暗流」：竖向水带 + 砖墙夹出窄道，绕水而行。15 敌 / 3 波。
   * 水列：col 1-2 / 4-5 / 7-8 / 10-11（row 2-3），
   *       以及 row 7 的横向水带（缺口 col 7 与两侧河岸）。
   * ============================================================== */
  const LEVEL_2 = {
    id: 2,
    name: '暗流',
    desc: '水带交错，只能贴着窄道摸过去。',
    theme: {
      bg: '#0a1b33',
      brick: '#b06a3c',
      steel: '#8fa2c4',
      water: '#1f5f9e',
      accent: '#59c8ff',
      accent2: '#c084fc'
    },
    map: [
      '...............',
      '...............',
      '.ww.ww.ww.ww...',
      '.ww.ww.ww.ww...',
      '...............',
      '...bb.....bb...',
      '...bb.....bb...',
      '...wwww.wwww...',
      '...............',
      '...bb.www.bb...',
      '...bb.www.bb...',
      '...............',
      '......ssss.....',
      '......sHHs.....',
      '......sHHs.....'
    ],
    enemyQuota: 24,
    waveSizes: [4, 4, 4, 4, 4, 4],
    hasBoss: false,
    playerSpawn: { x: PLAYER_SPAWN.x, y: PLAYER_SPAWN.y },
    dinner: { x: DINNER_PIXEL.x, y: DINNER_PIXEL.y, w: DINNER_PIXEL.w, h: DINNER_PIXEL.h },
    spawners: [
      { x: SPAWNERS[0].x, y: SPAWNERS[0].y },
      { x: SPAWNERS[1].x, y: SPAWNERS[1].y },
      { x: SPAWNERS[2].x, y: SPAWNERS[2].y }
    ]
  };

  /* ============================ 第 3 关 ============================
   * 「要塞」：钢墙堡坞 + 单格窄通道，中路只留 col 7 一条缝。12 敌 + BOSS。
   * ============================================================== */
  const LEVEL_3 = {
    id: 3,
    name: '要塞',
    desc: '钢墙合围的堡坞，中路只剩一条缝。',
    theme: {
      bg: '#1a1410',
      brick: '#a34d2c',
      steel: '#c8ccd2',
      water: '#3b6a55',
      accent: '#ff7a4d',
      accent2: '#ffe08a'
    },
    map: [
      '...............',
      '...............',
      '..sss.....sss..',
      '..s.........s..',
      '..s.ss...ss.s..',
      '..s.ss...ss.s..',
      '..s.........s..',
      '..s.........s..',
      '..sss.....sss..',
      '...............',
      '..bb...s...bb..',
      '...............',
      '......ssss.....',
      '......sHHs.....',
      '......sHHs.....'
    ],
    enemyQuota: 16,
    waveSizes: [4, 4, 4, 4],
    hasBoss: true,
    playerSpawn: { x: PLAYER_SPAWN.x, y: PLAYER_SPAWN.y },
    dinner: { x: DINNER_PIXEL.x, y: DINNER_PIXEL.y, w: DINNER_PIXEL.w, h: DINNER_PIXEL.h },
    spawners: [
      { x: SPAWNERS[0].x, y: SPAWNERS[0].y },
      { x: SPAWNERS[1].x, y: SPAWNERS[1].y },
      { x: SPAWNERS[2].x, y: SPAWNERS[2].y }
    ]
  };

  const Levels = [LEVEL_1, LEVEL_2, LEVEL_3];

  /**
   * 构建关卡网格（深拷贝，返回全新的 number[15][15]，行优先 grid[row][col]）。
   * 不修改 Levels 里的 map 字符串；返回的网格随便被子弹/坦克改都不影响原始数据。
   * @param {number} levelIndex 0-based 关卡索引，越界自动回绕。

  function buildGrid(levelIndex) {
    const n = Levels.length;
    let idx = Math.floor(Number(levelIndex));
    if (!isFinite(idx)) idx = 0;
    idx = ((idx % n) + n) % n;

    const rows = Levels[idx].map;
    const grid = new Array(ROWS);
    for (let r = 0; r < ROWS; r++) {
      const line = rows[r] || '';

        out[c] = t === undefined ? EMPTY : t;

  WV.buildGrid = buildGrid;

<script>
// ===== enemies.js =====
/* =============================================================
 * 鲸鱼娘大战 Claude v2 — src/enemies.js
 * 敌人类型数据 + 刷怪 / 移动 / 开火 / BOSS。契约见 SPEC-v2.md 5.2。
 * 浏览器全局脚本（IIFE），不 import/export，不依赖 DOM，Node 可直接加载。
 * 只通过 WV.* 调用 core 的碰撞/地形工具，不重复实现核心逻辑。
 * ============================================================= */
(function (root) {
  'use strict';

  const WV = root.WV = root.WV || {};

  const ENEMY_W = 34;
  const ENEMY_H = 34;
  const DECIDE_MIN = 0.5;   // 方向决策间隔（秒）
  const DECIDE_MAX = 1.5;
  const BULLET_LIFE = 2.4;  // 敌弹存活秒数（game.js 递减）
  const FLASH_SEC = 0.15;   // 受击闪白时长（game.js 用 flash*4 算透明度）
  const BOSS_SUMMON_CD = 8; // BOSS 阶段 2 召唤间隔
  const MAX_FIELD_ENEMIES = 6; // BOSS 召唤上限（含 BOSS 自身）

  // 与 core.js 一致的地形值；仅用于“子弹弹道上有没有墙”的射线采样
  const T_BRICK = 1;
  const T_STEEL = 2;

  /* ---------------- 敌人类型（SPEC 5.2 硬契约，勿改数值） ---------------- */
  const EnemyTypes = {
    grunt:  { hp: 1,  speed: 70,  fireMin: 2.1, fireMax: 3.6, bulletSpeed: 240, dmg: 1, score: 100,  radius: 17 },
    scout:  { hp: 1,  speed: 100, fireMin: 3.0, fireMax: 4.2, bulletSpeed: 260, dmg: 1, score: 120,  radius: 15 },
    heavy:  { hp: 3,  speed: 48,  fireMin: 2.5, fireMax: 4.0, bulletSpeed: 220, dmg: 2, score: 200,  radius: 18 },
    sniper: { hp: 2,  speed: 62,  fireMin: 3.4, fireMax: 4.6, bulletSpeed: 310, dmg: 1, score: 180,  radius: 16 },
    boss:   { hp: 20, speed: 46,  fireMin: 2.2, fireMax: 2.8, bulletSpeed: 210, dmg: 2, score: 1500, radius: 24 }
  };
  WV.EnemyTypes = EnemyTypes;

  /* ---------------- 局部小工具 ---------------- */
  function rand() {
    return typeof WV.rand === 'function' ? WV.rand() : Math.random();
  }
  function num(v, fallback) {
    return (typeof v === 'number' && isFinite(v)) ? v : fallback;
  }
  function mapW() { return num(WV.MAP_W, num(WV.COLS, 15) * num(WV.TILE, 40)); }
  function mapH() { return num(WV.MAP_H, num(WV.ROWS, 15) * num(WV.TILE, 40)); }
  function clamp(v, lo, hi) {
    if (hi < lo) return lo;
    if (typeof WV.clamp === 'function') return WV.clamp(v, lo, hi);
    return v < lo ? lo : (v > hi ? hi : v);
  }
  function clampX(x) { return clamp(x, 0, mapW() - ENEMY_W); }
  function clampY(y) { return clamp(y, 0, mapH() - ENEMY_H); }
  function dirDX(d) { return (WV.DX && WV.DX[d]) || 0; }
  function dirDY(d) { return (WV.DY && WV.DY[d]) || 0; }
  function tankFits(x, y) {
    return !WV.blockedForTank(x, y, ENEMY_W, ENEMY_H);
  }
  function typeOf(e) {
    return EnemyTypes[e.kind] || EnemyTypes.grunt;
  }
  function isBrickOrSteel(t) {
    return t === T_BRICK || t === T_STEEL;
  }
  function dinnerCenter(G) {
    if (G && G.dinner) {
      return { x: G.dinner.x + G.dinner.w / 2, y: G.dinner.y + G.dinner.h / 2 };
    }
    return { x: mapW() / 2, y: mapH() - 60 };
  }
  function playerCenter(G) {
    const p = G && G.player;
    if (p && p.alive !== false) {
      return { x: p.x + (p.w || ENEMY_W) / 2, y: p.y + (p.h || ENEMY_H) / 2 };
    }
    return null;
  }

  /* ---------------- 方向选择 ---------------- */

  // 朝目标点的四方向（主轴为目标差值大的那根轴，平局随机）
  function dirToward(e, tx, ty) {
    const dx = tx - (e.x + e.w / 2);
    const dy = ty - (e.y + e.h / 2);
    if (Math.abs(dx) < 0.001 && Math.abs(dy) < 0.001) return e.dir;
    let horizontal;
    if (Math.abs(dx) > Math.abs(dy)) horizontal = true;
    else if (Math.abs(dy) > Math.abs(dx)) horizontal = false;
    else horizontal = rand() < 0.5;
    if (horizontal) return dx >= 0 ? 1 : 3;
    return dy >= 0 ? 2 : 0;
  }

  // 候选方向顺序：首选 → 两个垂直方向 → 反向
  function dirCandidates(want) {
    const perp = (want % 2 === 0) ? [1, 3] : [0, 2];
    if (rand() < 0.5) { const t = perp[0]; perp[0] = perp[1]; perp[1] = t; }
    return [want, perp[0], perp[1], (want + 2) % 4];
  }

  // 按当前方向能否走 dist 像素（逐轴碰撞检测，含出界）
  function canWalk(e, d, dist) {
    if (!(dist > 0)) return false;
    const nx = e.x + dirDX(d) * dist;
    const ny = e.y + dirDY(d) * dist;
    if (nx < 0 || ny < 0 || nx + e.w > mapW() || ny + e.h > mapH()) return false;
    return !WV.blockedForTank(nx, ny, e.w, e.h);
  }

  function advance(e, d, dist) {
    e.x = clampX(e.x + dirDX(d) * dist);
    e.y = clampY(e.y + dirDY(d) * dist);
  }

  // 从“不走 avoidDir”的方向里随机挑一个当前走得通的；都不行就试 2px 微距
  function pickFreeDir(e, dist, avoidDir) {
    const primary = [];
    for (let d = 0; d < 4; d++) {
      if (d === avoidDir) continue;
      if (canWalk(e, d, dist)) primary.push(d);
    }
    if (!primary.length) {
      for (let d = 0; d < 4; d++) {
        if (d === avoidDir) continue;
        if (canWalk(e, d, 2)) primary.push(d);
      }
    }
    if (!primary.length) return -1;
    const back = (avoidDir + 2) % 4;
    const forward = primary.filter(function (d) { return d !== back; });
    const pool = forward.length ? forward : primary;
    const idx = Math.min(pool.length - 1, Math.floor(rand() * pool.length));
    return pool[idx];
  }

  // 每 0.5–1.5s 决策：35% 朝老巢 / 65% 朝玩家，并挑一个眼前不撞墙的方向
  function decideMovement(G, e) {
    const useDinner = rand() < 0.25;
    const target = useDinner ? dinnerCenter(G) : (playerCenter(G) || dinnerCenter(G));
    const want = dirToward(e, target.x, target.y);
    const order = dirCandidates(want);
    const probe = Math.max(8, Math.min(26, e.speed * 0.2));
    for (let i = 0; i < order.length; i++) {
      if (canWalk(e, order[i], probe)) {
        e.dir = order[i];
        return;
      }
    }
    // 四面都堵：保留当前方向，由 moveEnemy 的撞墙换向兜底
  }

  /* ---------------- 移动 ---------------- */

  function moveEnemy(e, dt) {
    const dist = e.speed * dt;
    if (!(dist > 0)) return false;

    // 主轴能走就走
    if (canWalk(e, e.dir, dist)) {
      advance(e, e.dir, dist);
      return true;
    }

    // 撞墙立即换向：挑一个真的走得通的方向，并保持至少 0.4s 防止贴墙抖动
    const turn = pickFreeDir(e, Math.max(6, Math.min(20, dist * 6)), e.dir);
    if (turn !== -1) {
      e.dir = turn;
      e._decisionT = Math.max(e._decisionT, 0.4);
      if (canWalk(e, e.dir, dist)) {
        advance(e, e.dir, dist);
        return true;
      }
    } else {
      // 完全困住（极端地形）：尽快重新决策，别原地死等
      e._decisionT = Math.min(e._decisionT, 0.25);
    }
    return false;
  }

  /* ---------------- 开火 ---------------- */

  function muzzleOf(e) {
    const off = e.w / 2 + 6; // 车头前方，避免子弹生在车体里
    return {
      x: e.x + e.w / 2 + dirDX(e.dir) * off,
      y: e.y + e.h / 2 + dirDY(e.dir) * off
    };
  }

  // 弹道上是否有砖/钢（老巢不挡：敌人就是要打老巢）
  function wallAhead(mx, my, d) {
    if (isBrickOrSteel(WV.tileAt(mx, my))) return true;
    for (let dist = 12; dist <= 156; dist += 12) {
      const px = mx + dirDX(d) * dist;
      const py = my + dirDY(d) * dist;
      if (px < 0 || py < 0 || px > mapW() || py > mapH()) return false;
      if (isBrickOrSteel(WV.tileAt(px, py))) return true;
    }
    return false;
  }

  // 前方 120px 内是否有其它活着的敌人（避免互相堵枪口）
  function friendlyAhead(G, e, mx, my, d) {
    const list = G.enemies || [];
    for (let i = 0; i < list.length; i++) {
      const o = list[i];
      if (!o || o === e || o.hp <= 0 || o.dead) continue;
      const left = o.x - 4, right = o.x + o.w + 4;
      const top = o.y - 4, bottom = o.y + o.h + 4;
      for (let dist = 8; dist <= 120; dist += 12) {
        const px = mx + dirDX(d) * dist;
        const py = my + dirDY(d) * dist;
        if (px > left && px < right && py > top && py < bottom) return true;
      }
    }
    return false;
  }

  function pushBullet(G, e, x, y, dx, dy, noDinner) {
    if (!Array.isArray(G.bullets)) G.bullets = [];
    const t = typeOf(e);
    // 只有 heavy/boss 能破钢：老巢钢墙只对重火力有威胁，玩家优先杀 heavy 就能守住
    const power = (e.kind === 'heavy' || e.kind === 'boss') ? 2 : 1;
    G.bullets.push({
      x: x,
      y: y,
      dx: dx,
      dy: dy,
      speed: t.bulletSpeed,
      owner: 'enemy',
      dmg: t.dmg,
      power: power,
      life: BULLET_LIFE,
      noDinner: !!noDinner
    });
  }

  // 朝向上 260px 内有没有玩家或老巢：没有就不开枪，避免隔着半张地图拆墙
  function aheadHasTarget(G, e) {
    const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
    const p = G.player;
    for (let dist = 16; dist <= 260; dist += 16) {
      const px = cx + dirDX(e.dir) * dist;
      const py = cy + dirDY(e.dir) * dist;
      if (p && p.lives > 0 &&
          px > p.x - 6 && px < p.x + p.w + 6 &&
          py > p.y - 6 && py < p.y + p.h + 6) return true;
      if (G.dinner &&
          px > G.dinner.x - 4 && px < G.dinner.x + G.dinner.w + 4 &&
          py > G.dinner.y - 4 && py < G.dinner.y + G.dinner.h + 4) return true;
    }
    return false;
  }

  function tryFire(G, e) {
    const t = typeOf(e);
    const m = muzzleOf(e);
    if (!aheadHasTarget(G, e)) { e.fireCd = 0.5 + rand() * 0.5; return false; }
    if (wallAhead(m.x, m.y, e.dir) || friendlyAhead(G, e, m.x, m.y, e.dir)) {
      // 被挡：短延迟后重试，不重置整段冷却
      e.fireCd = 0.18 + rand() * 0.24;
      return false;
    }
    pushBullet(G, e, m.x, m.y, dirDX(e.dir), dirDY(e.dir));
    e.fireCd = t.fireMin + rand() * (t.fireMax - t.fireMin);
    return true;
  }

  /* ---------------- BOSS ---------------- */

  function bossPickDir(G, e) {
    const opts = [];
    for (let d = 0; d < 4; d++) {
      if (!canWalk(e, d, 24)) continue;
      // 靠近边界时降低继续朝墙走的权重，让 BOSS 在场地中缓慢换位
      const look = 90;
      const nx = e.x + dirDX(d) * look;
      const ny = e.y + dirDY(d) * look;
      const risky = nx < 50 || ny < 50 || nx + e.w > mapW() - 50 || ny + e.h > mapH() - 50;
      opts.push({ d: d, w: risky ? 0.25 : 1 });
    }
    if (!opts.length) return;
    let total = 0;
    for (let i = 0; i < opts.length; i++) total += opts[i].w;
    let r = rand() * total;
    for (let i = 0; i < opts.length; i++) {
      r -= opts[i].w;
      if (r <= 0) { e.dir = opts[i].d; return; }
    }
    e.dir = opts[opts.length - 1].d;
  }

  function aliveEnemyCount(G) {
    let n = 0;
    const list = G.enemies || [];
    for (let i = 0; i < list.length; i++) {
      const o = list[i];
      if (o && o.hp > 0 && !o.dead) n++;
    }
    return n;
  }

  // BOSS 阶段 1：三向扇形（中间 + 左右各偏 20°）；阶段 2 额外每 8s 召唤
  function bossPattern(G, e) {
    if (!G || !e || e.hp <= 0 || e.dead) return;

    // 弹幕基准方向：瞄玩家（移动上依旧不追玩家）；没有玩家就按面朝方向
    const pc = playerCenter(G);
    let base;
    if (pc) {
      base = Math.atan2(pc.y - (e.y + e.h / 2), pc.x - (e.x + e.w / 2));
    } else {
      base = [-Math.PI / 2, 0, Math.PI / 2, Math.PI][e.dir & 3];
    }

    // 阶段 1 单发瞄玩家，阶段 2 才三向扇形：前半段给玩家喘口气
    const spread = 20 * Math.PI / 180;
    const phase2 = e.hp <= e.maxHp * 0.5;
    const angles = phase2 ? [base - spread, base + spread] : [base];
    const cx = e.x + e.w / 2;
    const cy = e.y + e.h / 2;
    const off = e.w / 2 + 8;
    const mx = cx + Math.cos(base) * off;
    const my = cy + Math.sin(base) * off;
    for (let i = 0; i < angles.length; i++) {
      const a = angles[i];
      // BOSS 弹幕不拆家：追着玩家打，但别把大白饭顺手端走
      pushBullet(G, e, mx, my, Math.cos(a), Math.sin(a), true);
    }

    // 阶段 2：血量 <= 50% 后每 8s 召唤 2 个 grunt；场上 <6 才召，且最多召 2 次（不无限堆）
    if (e.hp <= e.maxHp * 0.5 && e._summonT <= 0 && (e._summons || 0) < 2) {
      e._summonT = BOSS_SUMMON_CD;
      e._summons = (e._summons || 0) + 1;
      summonGrunts(G, e);
    }
  }

  function summonGrunts(G, e) {
    const slots = Math.min(2, Math.max(0, MAX_FIELD_ENEMIES - aliveEnemyCount(G)));
    for (let i = 0; i < slots; i++) {
      const spot = findSpotNear(G, e.x + e.w / 2, e.y + e.h / 2, 46, 170, 6);
      if (!spot) continue;
      const g = spawn(G, 'grunt', spot.x, spot.y);
      if (g) g.summoned = true;   // 召唤物不计入剩余敌人
    }
  }

  function updateBoss(G, e, dt) {
    e._decisionT -= dt;
    if (e._decisionT <= 0) {
      bossPickDir(G, e);
      e._decisionT = 2.4 + rand() * 1.6;
    }
    moveEnemy(e, dt);

    const phase2 = e.hp <= e.maxHp * 0.5;
    if (phase2 && e._summonT > 0) e._summonT -= dt;

    if (e.fireCd <= 0) {
      bossPattern(G, e);
      e.fireCd = EnemyTypes.boss.fireMin +
        rand() * (EnemyTypes.boss.fireMax - EnemyTypes.boss.fireMin);
    }
  }

  /* ---------------- 出生点 ---------------- */

  function isSpotFree(G, x, y, pad) {
    if (!tankFits(x, y)) return false;
    const p = G && G.player;
    if (p && p.alive !== false) {
      if (WV.aabb(x - pad, y - pad, ENEMY_W + pad * 2, ENEMY_H + pad * 2,
        p.x, p.y, p.w || ENEMY_W, p.h || ENEMY_H)) return false;
    }
    const list = (G && G.enemies) || [];
    for (let i = 0; i < list.length; i++) {
      const o = list[i];
      if (!o || o.hp <= 0 || o.dead) continue;
      if (WV.aabb(x - pad, y - pad, ENEMY_W + pad * 2, ENEMY_H + pad * 2,
        o.x, o.y, o.w, o.h)) return false;
    }
    return true;
  }

  // 在 (cx,cy) 附近找一个不撞墙、不压坦克的点
  function findSpotNear(G, cx, cy, minR, maxR, pad) {
    for (let i = 0; i < 32; i++) {
      const a = rand() * Math.PI * 2;
      const r = minR + rand() * Math.max(1, maxR - minR);
      const x = clampX(cx + Math.cos(a) * r - ENEMY_W / 2);
      const y = clampY(cy + Math.sin(a) * r - ENEMY_H / 2);
      if (isSpotFree(G, x, y, pad)) return { x: x, y: y };
    }
    // 环形兜底：按 40px 网格试探，保证墙边也有落点
    const offs = [0, 40, -40, 80, -80, 120, -120, 160, -160];
    for (let oy = 0; oy < offs.length; oy++) {
      for (let ox = 0; ox < offs.length; ox++) {
        const x = clampX(cx + offs[ox] - ENEMY_W / 2);
        const y = clampY(cy + offs[oy] - ENEMY_H / 2);
        if (isSpotFree(G, x, y, pad)) return { x: x, y: y };
      }
    }
    return null;
  }

  function findAnyFreeSpot(G, pad) {
    for (let y = 0; y + ENEMY_H <= mapH(); y += 10) {
      for (let x = 0; x + ENEMY_W <= mapW(); x += 10) {
        if (isSpotFree(G, x, y, pad)) return { x: x, y: y };
      }
    }
    return null;
  }

  const DEFAULT_SPAWNERS = [
    { x: 3, y: 3 },
    { x: 283, y: 3 },
    { x: 523, y: 3 }
  ];

  function pickSpawn(G) {
    const spawners = (G && Array.isArray(G.spawners) && G.spawners.length)
      ? G.spawners : DEFAULT_SPAWNERS;
    const order = spawners.slice();
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const tmp = order[i];
      order[i] = order[j];
      order[j] = tmp;
    }

    for (let i = 0; i < order.length; i++) {
      const s = order[i] || {};
      const x = clampX(num(s.x, 0));
      const y = clampY(num(s.y, 0));
      if (isSpotFree(G, x, y, 4)) return { x: x, y: y };
      const near = findSpotNear(G, x + ENEMY_W / 2, y + ENEMY_H / 2, 12, 150, 4);
      if (near) return near;
    }

    // 三个出生点附近都挤满时，全图找一个空位；实在没有才退回原点
    const any = findAnyFreeSpot(G, 4);
    if (any) return any;
    const s = spawners[0] || { x: 0, y: 0 };
    return { x: clampX(num(s.x, 0)), y: clampY(num(s.y, 0)) };
  }

  /* ---------------- 创建 / 更新 / 受击 ---------------- */

  function spawn(G, kind, px, py) {
    if (!G) return null;
    if (!Array.isArray(G.enemies)) G.enemies = [];
    const k = EnemyTypes[kind] ? kind : 'grunt';
    const t = EnemyTypes[k];
    const x = clampX(num(px, 0));
    const y = clampY(num(py, 0));
    const e = {
      kind: k,
      x: x,
      y: y,
      w: ENEMY_W,
      h: ENEMY_H,
      dir: 2,
      speed: t.speed,
      hp: t.hp,
      maxHp: t.hp,
      fireCd: 0.4 + rand() * 0.8,
      flash: 0,
      isBoss: k === 'boss',
      score: t.score,
      radius: t.radius,
      power: (k === 'heavy' || k === 'boss') ? 2 : 1,
      dead: false,
      _decisionT: 0.3 + rand() * 0.7,
      _summonT: BOSS_SUMMON_CD
    };

    if (e.isBoss) {
      e.fireCd = 0.7 + rand() * 0.5;
      e._decisionT = 1.6 + rand() * 1.2;
      bossPickDir(G, e);
    } else {
      const target = dinnerCenter(G);
      e.dir = dirToward(e, target.x, target.y);
      if (!canWalk(e, e.dir, 8)) {
        const d = pickFreeDir(e, 8, e.dir);
        if (d !== -1) e.dir = d;
      }
    }

    G.enemies.push(e);
    if (e.isBoss) {
      G.boss = e;
      G.bossMaxHp = t.hp;
      G.bossHp = t.hp;
    }
    return e;
  }

  function update(G, dt) {
    if (!G || !Array.isArray(G.enemies)) return;
    const step = (typeof dt === 'number' && isFinite(dt) && dt > 0)
      ? Math.min(dt, 0.1) : 0;
    if (!(step > 0)) return;

    // 快照遍历：BOSS 召唤会向 G.enemies push 新敌人，本帧不重复驱动它们
    const list = G.enemies.slice();
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (!e || e.hp <= 0 || e.dead) continue;

      if (e.flash > 0) e.flash = Math.max(0, e.flash - step);

      e._stuckT += step;

  function damage(G, e, dmg) {
    if (!e || e.hp <= 0 || e.dead) return false;
    const amount = (typeof dmg === 'number' && isFinite(dmg) && dmg > 0) ? dmg : 1;
    e.hp -= amount;
    e.flash = FLASH_SEC;
    if (e.isBoss && G) G.bossHp = Math.max(0, e.hp);

      e.dead = true;
      if (e.isBoss && G) G.bossHp = 0;

<script>
// ===== player.js =====
/**
 * 鲸鱼娘大战 Claude v2 — 玩家模块（SPEC 5.3）
 *
 * 只通过 WV.* 调用 core.js 提供的常量/碰撞/音效，不引用其它模块文件。
 * 浏览器全局 IIFE；不访问 DOM 的路径在 Node 里可直接加载。
 * 触控：左下虚拟方向盘 + 右下开火圆钮，Pointer Events + setPointerCapture，只认第一根手指。
 */
(function (root) {
  'use strict';

  const WV = root.WV = root.WV || {};

  /* ---------------- 兜底常量（core.js 未加载时也不炸） ---------------- */
  const DEF_TILE = 40;
  const DEF_MAP_W = 600;
  const DEF_MAP_H = 600;
  const DEF_W = 800; // 画布逻辑宽（600 游戏区 + 200 HUD）
  const DEF_H = 600;
  const DEF_DX = [0, 1, 0, -1]; // 0上 1右 2下 3左
  const DEF_DY = [-1, 0, 1, 0];

  /* ---------------- 玩家数值（SPEC 5.3） ---------------- */
  const PLAYER_W = 34;
  const PLAYER_H = 34;
  const BASE_SPEED = 150; // px/s
  const BASE_FIRE_RATE = 0.28; // s
  const BASE_LIVES = 5;
  const BASE_BULLET_SPEED = 300;
  const INVULN_TIME = 2.0; // 受击后无敌 2s
  const SHIELD_PER_CARD = 0.8; // 'shield' 每张 +0.8s 无敌
  const MIN_FIRE_RATE = 0.12; // 连射下限
  const MAX_SPEED_MULT = 1.6; // 轻装上限 +60%
  const MAX_BULLET_SPEED = 720;
  const MUZZLE_OFFSET = 18; // 子弹出生点：车头前方 18px
  const DOUBLE_GAP = 6; // 双发并排偏移 ±6px
  const BULLET_LIFE = 2.5; // 子弹存活秒数（game.js 递减；约 700px 射程）
  const MAX_LIVES = 5;

  /* ---------------- 触控区（画布坐标；游戏区 600x600，HUD 在右侧不占） ---------------- */
  const DPAD_SIZE = 132; // 左下 132px 虚拟方向区
  const FIRE_DIAM = 96; // 右下 96px 圆形开火键
  const FIRE_MARGIN = 14;
  const MIN_HIT_SIZE = 44; // 触控目标下限
  const DPAD_DEADZONE = 10;

  /* ---------------- 小工具 ---------------- */
  function tileSize() { return WV.TILE || DEF_TILE; }
  function mapW() { return WV.MAP_W || DEF_MAP_W; }
  function mapH() { return WV.MAP_H || DEF_MAP_H; }
  function dirDX(d) { return (WV.DX || DEF_DX)[d] || 0; }
  function dirDY(d) { return (WV.DY || DEF_DY)[d] || 0; }

  function clamp(v, min, max) {
    if (typeof WV.clamp === 'function') return WV.clamp(v, min, max);
    if (max < min) return min;
    return v < min ? min : (v > max ? max : v);
  }

  /** 玩家 34x34 包围盒是否撞墙；core 缺失时退化为角点采样 tileAt */
  function blocked(x, y, w, h) {
    if (typeof WV.blockedForTank === 'function') return !!WV.blockedForTank(x, y, w, h);
    if (typeof WV.tileAt !== 'function') return false;
    const pts = [
      [x + 1, y + 1], [x + w - 1, y + 1],
      [x + 1, y + h - 1], [x + w - 1, y + h - 1],
    ];
    for (let i = 0; i < pts.length; i++) {
      if (WV.tileAt(pts[i][0], pts[i][1]) !== 0) return true;
    }
    return false;
  }

  function blockedAt(x, y) {
    if (x < 0 || y < 0 || x + PLAYER_W > mapW() || y + PLAYER_H > mapH()) return true;
    return blocked(x, y, PLAYER_W, PLAYER_H);
  }

  /** 容错播音：audio 不存在或抛错都不影响逻辑 */
  function playAudio(name) {
    try {
      if (WV.audio && typeof WV.audio.play === 'function') WV.audio.play(name);
    } catch (e) { /* 静默降级 */ }
  }

  /* ---------------- 玩家对象 ---------------- */

  function create(G) {
    const spawn = spawnPoint(G);
    return {
      x: spawn.x,
      y: spawn.y,
      w: PLAYER_W,
      h: PLAYER_H,
      dir: 0,
      speed: BASE_SPEED,
      baseSpeed: BASE_SPEED,
      cd: 0,
      fireRate: BASE_FIRE_RATE,
      lives: BASE_LIVES,
      invuln: 0,
      isPlayer: true,
      bulletSpeed: BASE_BULLET_SPEED,
      bulletPower: 1,
      pierce: 0,
      shieldTime: 0,
      doubleShot: false,
      doubleLevel: 0,
      alive: true,
      flash: 0,
    };
  }

  /** 出生点：优先 G.playerSpawn（其次是关卡对象），坐标语义按左上角处理并做容错 */
  function spawnPoint(G) {
    const lv = G && (G.levelData || (typeof G.level === 'object' ? G.level : null));
    const sp = (G && G.playerSpawn) || (lv && lv.playerSpawn) || null;
    let x = sp && isFinite(sp.x) ? sp.x : 5 * tileSize();
    let y = sp && isFinite(sp.y) ? sp.y : 13 * tileSize();
    // 兼容关卡把 playerSpawn 写成「坦克左下角」的情况：贴到/超出地图底部时上移一个身高
    if (y > mapH() - PLAYER_H) y -= PLAYER_H;
    x = clamp(x, 0, mapW() - PLAYER_W);
    y = clamp(y, 0, mapH() - PLAYER_H);
    // 出生点若被挡（关卡墙压住），就近找一个空格，避免一开局卡在墙里
    return nearestFree(x, y);
  }

  function nearestFree(x, y) {
    if (!blockedAt(x, y)) return { x: x, y: y };
    const t = tileSize() || DEF_TILE;
    let best = { x: x, y: y };
    let bestD = Infinity;
    for (let r = 0; r < 15; r++) {
      for (let c = 0; c < 15; c++) {
        const tx = c * t + (t - PLAYER_W) / 2;
        const ty = r * t + (t - PLAYER_H) / 2;
        if (tx < 0 || ty < 0 || tx + PLAYER_W > mapW() || ty + PLAYER_H > mapH()) continue;
        if (blockedAt(tx, ty)) continue;
        const d = (tx - x) * (tx - x) + (ty - y) * (ty - y);
        if (d < bestD) { bestD = d; best = { x: tx, y: ty }; }
      }
    }
    return best;
  }

  function resolvePlayer(G) {
    if (!G) return null;
    if (G.player) return G.player;
    if (G.isPlayer) return G;
    if (typeof G.lives === 'number' && typeof G.x === 'number' && typeof G.y === 'number') return G;
    return null;
  }

  function ensurePlayer(G) {
    let p = resolvePlayer(G);
    if (!p && G) { p = create(G); G.player = p; }
    return p;
  }

  /* ---------------- 输入 ---------------- */

  /** 触控状态（键盘/鼠标仍由 game.js 写 WV.input，这里只叠加方向键优先的触控） */
  const touch = {
    dir: -1,
    fire: false,
    moveId: null,
    fireId: null,
    canvas: null,
    enabled: false,
  };

  function readInput() {
    const raw = WV.input || {};
    let dir = (typeof raw.dir === 'number' && raw.dir >= 0 && raw.dir <= 3) ? raw.dir : -1;
    if (touch.dir >= 0 && touch.dir <= 3) dir = touch.dir;
    const fire = !!raw.fire || !!touch.fire;
    return { dir: dir, fire: fire };
  }

  /* ---------------- 移动（逐轴防穿墙 + 单轴滑动 + 子步进防穿透） ---------------- */

  function moveBy(p, mx, my) {
    if (!mx && !my) return false;
    const dist = Math.sqrt(mx * mx + my * my);
    const steps = Math.max(1, Math.ceil(dist / 6));
    const sx = mx / steps;
    const sy = my / steps;
    let moved = false;
    for (let i = 0; i < steps; i++) {
      if (stepOnce(p, sx, sy)) moved = true;
    }
    return moved;
  }

  function stepOnce(p, mx, my) {
    const nx = clamp(p.x + mx, 0, mapW() - PLAYER_W);
    const ny = clamp(p.y + my, 0, mapH() - PLAYER_H);
    // 先整体试
    if ((nx !== p.x || ny !== p.y) && !blockedAt(nx, ny)) {
      p.x = nx;
      p.y = ny;
      return true;
    }
    // 再逐轴滑动
    let moved = false;
    if (mx) {
      const tx = clamp(p.x + mx, 0, mapW() - PLAYER_W);
      if (tx !== p.x && !blockedAt(tx, p.y)) { p.x = tx; moved = true; }
    }
    if (my) {
      const ty = clamp(p.y + my, 0, mapH() - PLAYER_H);
      if (ty !== p.y && !blockedAt(p.x, ty)) { p.y = ty; moved = true; }
    }
    return moved;
  }

  /* ---------------- 开火 ---------------- */

  function doubleOffsets(p) {
    const lv = Math.max(1, p.doubleLevel || 1);
    if (lv === 1) return [-DOUBLE_GAP, DOUBLE_GAP];
    if (lv === 2) return [-DOUBLE_GAP, 0, DOUBLE_GAP];
    return [-DOUBLE_GAP * 2, -DOUBLE_GAP, DOUBLE_GAP, DOUBLE_GAP * 2];
  }

  function shoot(G, p) {
    const list = G.bullets || (G.bullets = []);
    const d = p.dir | 0;
    const ux = dirDX(d);
    const uy = dirDY(d);
    // 车头前方 18px，bullet 的 x/y 为弹丸中心
    const cx = p.x + p.w / 2 + ux * MUZZLE_OFFSET;
    const cy = p.y + p.h / 2 + uy * MUZZLE_OFFSET;
    const offsets = p.doubleShot ? doubleOffsets(p) : [0];
    for (let i = 0; i < offsets.length; i++) {
      const o = offsets[i];
      const vertical = ux === 0; // 上下开火时并排方向是左右
      list.push({
        x: vertical ? cx + o : cx,
        y: vertical ? cy : cy + o,
        dx: ux,
        dy: uy,
        speed: p.bulletSpeed || BASE_BULLET_SPEED,
        owner: 'player',
        dmg: 1,
        power: p.bulletPower || 1,
        pierce: p.pierce || 0,
        life: BULLET_LIFE,
      });
    }
    playAudio('shoot');
  }

  /* ---------------- 每帧更新 ---------------- */

  function update(G, dt) {
    if (!G) return;
    const p = ensurePlayer(G);
    if (!p) return;
    const step = (typeof dt === 'number' && isFinite(dt) && dt > 0) ? Math.min(dt, 0.1) : 0;

    // 计时器递减：开火冷却、无敌（受击后 2s + 护盾加成）、受击闪白
    if (p.cd > 0) p.cd = Math.max(0, p.cd - step);
    if (p.invuln > 0) p.invuln = Math.max(0, p.invuln - step);
    if (p.flash > 0) p.flash = Math.max(0, p.flash - step);

    if (p.alive === false) return;
    if (step <= 0) return;

    const inp = readInput();
    if (inp.dir >= 0 && inp.dir <= 3) {
      p.dir = inp.dir;
      const spd = Math.max(0, p.speed || 0);
      moveBy(p, dirDX(p.dir) * spd * step, dirDY(p.dir) * spd * step);
    }

    if (inp.fire) {
      if (p.cd <= 0) {
        shoot(G, p);
        p.cd = Math.max(MIN_FIRE_RATE, p.fireRate > 0 ? p.fireRate : BASE_FIRE_RATE);
      }
    }
  }

  /* ---------------- 受击 ---------------- */

  /**
   * 受击：无敌期直接返回 true（活着）。
   * 否则掉命 + 音效 + 无敌 2s(+护盾)，返回是否还活着；lives<=0 返回 false（game.js 判负/重生）。
   */
  function hit(G) {
    const p = resolvePlayer(G);
    if (!p) return false;
    if (p.invuln > 0) return true;
    p.lives = (typeof p.lives === 'number' ? p.lives : 1) - 1;
    p.invuln = INVULN_TIME + (p.shieldTime || 0);
    p.flash = 0.25;
    playAudio('playerHit');
    if (p.lives <= 0) {
      p.lives = 0;
      p.alive = false;
      return false;
    }
    p.alive = true;
    return true;
  }

  /* ---------------- 强化 ---------------- */

  function applyUpgrade(G, id) {
    const p = resolvePlayer(G);
    if (!p) return false;
    switch (id) {
      case 'power': // 子弹速度 +20%，射速 +15%
        p.bulletSpeed = Math.min(MAX_BULLET_SPEED, (p.bulletSpeed || BASE_BULLET_SPEED) * 1.2);
        p.fireRate = Math.max(MIN_FIRE_RATE, (p.fireRate || BASE_FIRE_RATE) * 0.85);
        return true;
      case 'pierce': // 每张多穿透一个敌人
        p.pierce = (p.pierce || 0) + 1;
        return true;
      case 'speed': // 移动 +15%，最多 +60%
        p.speed = Math.min((p.baseSpeed || BASE_SPEED) * MAX_SPEED_MULT, (p.speed || BASE_SPEED) * 1.15);
        return true;
      case 'life': // 生命 +1，上限 5
        p.lives = Math.min(MAX_LIVES, (typeof p.lives === 'number' ? p.lives : BASE_LIVES) + 1);
        return true;
      case 'shield': // 受击后无敌 +0.8s，可叠加
        p.shieldTime = (p.shieldTime || 0) + SHIELD_PER_CARD;
        return true;
      case 'rapid': // 开火间隔 -20%，下限 0.12s
        p.fireRate = Math.max(MIN_FIRE_RATE, (p.fireRate || BASE_FIRE_RATE) * 0.8);
        return true;
      case 'double': // 双发；重复拿升级为 3 发/4 发扇形并排
        p.doubleLevel = (p.doubleLevel || 0) + 1;
        p.doubleShot = true;
        return true;
      case 'bomb': // 子弹威力 +1（可破钢）
        p.bulletPower = Math.min(3, (p.bulletPower || 1) + 1);
        return true;
      default:
        return false;
    }
  }

  /* ---------------- 触控 ---------------- */

  function dpadZone() {
    const h = mapH();
    return {
      x: 0,
      y: h - DPAD_SIZE,
      w: DPAD_SIZE,
      h: DPAD_SIZE,
      cx: DPAD_SIZE / 2,
      cy: h - DPAD_SIZE / 2,
    };
  }

  function fireZone() {
    const w = mapW();
    const h = mapH();
    const r = Math.max(FIRE_DIAM / 2, MIN_HIT_SIZE / 2);
    return { cx: w - (FIRE_DIAM / 2 + FIRE_MARGIN), cy: h - (FIRE_DIAM / 2 + FIRE_MARGIN), r: r };
  }

  function inRect(pos, r) {
    return pos.x >= r.x && pos.x <= r.x + r.w && pos.y >= r.y && pos.y <= r.y + r.h;
  }

  function inCircle(pos, c) {
    const dx = pos.x - c.cx;
    const dy = pos.y - c.cy;
    return dx * dx + dy * dy <= c.r * c.r;
  }

  function updateDirFromDpad(pos, z) {
    if (!pos) return;
    const dx = pos.x - z.cx;
    const dy = pos.y - z.cy;
    const ax = Math.abs(dx);
    const ay = Math.abs(dy);
    if (Math.max(ax, ay) < DPAD_DEADZONE) return; // 中心死区：保持原方向
    touch.dir = ax > ay ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
  }

  /** 浏览器坐标 → 画布逻辑坐标（用逻辑 800x600 换算，兼容 CSS 缩放与 DPR 放大） */
  function toCanvas(canvas, ev) {
    if (!ev || typeof ev.clientX !== 'number') return null;
    let rect = null;
    try { rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : null; } catch (e) { rect = null; }
    const cw = WV.W || canvas.width || DEF_W;
    const ch = WV.H || canvas.height || DEF_H;
    const rw = (rect && rect.width) || cw;
    const rh = (rect && rect.height) || ch;
    const left = rect ? rect.left : 0;
    const top = rect ? rect.top : 0;
    return { x: (ev.clientX - left) * (cw / rw), y: (ev.clientY - top) * (ch / rh) };
  }

  function capture(canvas, id) {
    if (id === undefined || id === null) return;
    if (typeof canvas.setPointerCapture === 'function') {
      try { canvas.setPointerCapture(id); } catch (e) { /* 指针已失效，忽略 */ }
    }
  }

  function release(canvas, id) {
    if (id === undefined || id === null) return;
    if (typeof canvas.releasePointerCapture === 'function') {
      try {
        if (!canvas.hasPointerCapture || canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
      } catch (e) { /* 忽略 */ }
    }
  }

  function resolveCanvas(G) {
    if (G && G.canvas && typeof G.canvas.addEventListener === 'function') return G.canvas;
    if (typeof document === 'undefined') return null;
    try {
      return document.querySelector('canvas') || document.getElementById('game') || null;
    } catch (e) {
      return null;
    }
  }

  function attachTouch(G) {
    if (typeof document === 'undefined') return false;
    const canvas = resolveCanvas(G);
    if (!canvas || typeof canvas.addEventListener !== 'function') return false;
    touch.enabled = true;
    if (touch.canvas === canvas) return true; // 只绑一次
    touch.canvas = canvas;

    const onDown = function (ev) {
      if (ev.pointerType === 'mouse' && typeof ev.button === 'number' && ev.button !== 0) return;
      const pos = toCanvas(canvas, ev);
      if (!pos) return;
      const fz = fireZone();
      if (inCircle(pos, fz)) {
        if (touch.fireId !== null) return; // 只认第一根手指
        touch.fireId = ev.pointerId;
        touch.fire = true;
        capture(canvas, ev.pointerId);
        if (ev.preventDefault) ev.preventDefault();
        return;
      }
      const dz = dpadZone();
      if (inRect(pos, dz)) {
        if (touch.moveId !== null) return; // 只认第一根手指
        touch.moveId = ev.pointerId;
        updateDirFromDpad(pos, dz);
        capture(canvas, ev.pointerId);
        if (ev.preventDefault) ev.preventDefault();
      }
      // 区域外（HUD/卡牌按钮）：不拦，交给 UI
    };

    const onMove = function (ev) {
      if (ev.pointerId === touch.moveId) {
        updateDirFromDpad(toCanvas(canvas, ev), dpadZone());
        if (ev.preventDefault) ev.preventDefault();
      } else if (ev.pointerId === touch.fireId) {
        if (ev.preventDefault) ev.preventDefault();
      }
    };

    const onUp = function (ev) {
      if (ev.pointerId === touch.moveId) {
        touch.moveId = null;
        touch.dir = -1;
        release(canvas, ev.pointerId);
      } else if (ev.pointerId === touch.fireId) {
        touch.fireId = null;
        touch.fire = false;
        release(canvas, ev.pointerId);
      }
    };

    canvas.addEventListener('pointerdown', onDown, { passive: false });
    canvas.addEventListener('pointermove', onMove, { passive: false });
    canvas.addEventListener('pointerup', onUp, { passive: false });
    canvas.addEventListener('pointercancel', onUp, { passive: false });
    canvas.addEventListener('lostpointercapture', onUp, { passive: true });
    return true;
  }

  /* ---------------- 导出（SPEC 5.3） ---------------- */

  WV.Player = {
    create: create,
    update: update,
    hit: hit,
    applyUpgrade: applyUpgrade,
    attachTouch: attachTouch,
    touch: touch,
    // 便于测试/调试的只读辅助，不影响契约
    spawnPoint: spawnPoint,
    zones: function () { return { dpad: dpadZone(), fire: fireZone() }; },
  };

  WV.UPGRADES = [

    { id: 'pierce', name: '穿甲弹', desc: '子弹可击穿一个敌人', icon: '🎯' },

<script>
// ===== fx.js =====
// fx.js — 局部粒子 / 飘字 / 顿帧 + WebAudio 合成音效（SPEC 5.4）
// 铁律：不做全屏闪 / 震屏。反馈只有局部粒子、飘字、顿帧、音效。
// 纯全局脚本（IIFE），Node 下可直接加载；window / document / AudioContext 全部 typeof 保护。
(function (root) {
  'use strict';
  const WV = root.WV = root.WV || {};

  const TAU = Math.PI * 2;

  // ---------- 工具 ----------
  function rand() {
    return typeof WV.rand === 'function' ? WV.rand() : Math.random();
  }
  function rrange(a, b) { return a + (b - a) * rand(); }
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function num(v, dflt) {
    return typeof v === 'number' && isFinite(v) ? v : dflt;
  }

  const MAX_PARTICLES = 600;
  const MAX_FLOATS = 40;

  // =====================================================================
  //  WV.FX
  // =====================================================================
  WV.FX = {
    // 在 (x,y) 爆出 n 个粒子。颜色、数量、初速都可调。
    burst: function (G, x, y, color, n, speed) {
      if (!G) return;
      if (!Array.isArray(G.particles)) G.particles = [];
      const count = clamp(Math.floor(num(n, 12)), 0, 240);
      const spd = Math.max(0, num(speed, 120));
      const list = G.particles;
      const make = Math.min(count, MAX_PARTICLES - list.length);
      const px = num(x, 0);
      const py = num(y, 0);
      const col = color || '#ffd166';
      for (let i = 0; i < make; i++) {
        const ang = rand() * TAU;
        const sp = spd * rrange(0.35, 1.15);
        const life = rrange(0.26, 0.72);
        list.push({
          x: px + rrange(-3, 3),
          y: py + rrange(-3, 3),
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp,
          life: life,
          maxLife: life,
          size: rrange(1.6, 3.8),
          color: col,
          shape: rand() < 0.42 ? 'sq' : 'dot',
          drag: rrange(1.4, 2.6),
        });
      }
    },

    // 飘字：向上飘 + 尾段淡出。text 可以是数字。
    float: function (G, x, y, text, color) {
      if (!G) return;
      if (!Array.isArray(G.floats)) G.floats = [];
      const t = text == null ? '' : String(text);
      if (!t) return;
      const life = 0.95;
      G.floats.push({
        x: num(x, 0),
        y: num(y, 0),
        text: t,
        color: color || '#ffffff',
        life: life,
        maxLife: life,
        vy: -40,
        size: 15,
      });
      if (G.floats.length > MAX_FLOATS) {
        G.floats.splice(0, G.floats.length - MAX_FLOATS);
      }
    },

    // 顿帧：只加不减，由 game.js 自己递减。
    hitstop: function (G, sec) {
      if (!G) return;
      const s = num(sec, 0);
      if (s <= 0) return;
      G.hitstop = Math.max(num(G.hitstop, 0), s);
    },

    // 推进粒子 / 飘字，移除过期的。
    update: function (G, dt) {
      if (!G) return;
      let d = num(dt, 0);
      if (d < 0) d = 0;
      if (d > 0.05) d = 0.05;  // 卡帧保护，避免粒子一帧飞太远

      const ps = G.particles;
      if (Array.isArray(ps)) {
        for (let i = ps.length - 1; i >= 0; i--) {
          const p = ps[i];
          p.life -= d;
          if (!(p.life > 0)) {
            ps.splice(i, 1);
            continue;
          }
          const decay = Math.exp(-num(p.drag, 2) * d);
          p.vx *= decay;
          p.vy *= decay;
          p.x += p.vx * d;
          p.y += p.vy * d;
        }
      }

      const fs = G.floats;
      if (Array.isArray(fs)) {
        for (let i = fs.length - 1; i >= 0; i--) {
          const f = fs[i];
          f.life -= d;
          if (!(f.life > 0)) {
            fs.splice(i, 1);
            continue;
          }
          f.y += num(f.vy, -40) * d;
        }
      }
    },

    // 渲染：圆点 / 方块粒子 + 描边飘字。ctx 可以是假对象，只调标准 2D API。
    draw: function (G, ctx) {
      if (!G || !ctx) return;

      const ps = G.particles;
      if (Array.isArray(ps) && ps.length) {
        ctx.save();
        for (let i = 0; i < ps.length; i++) {
          const p = ps[i];
          const a = p.maxLife > 0 ? clamp(p.life / p.maxLife, 0, 1) : 1;
          ctx.globalAlpha = a;
          ctx.fillStyle = p.color || '#ffd166';
          const s = p.size > 0 ? p.size : 2;
          if (p.shape === 'sq') {
            ctx.fillRect(p.x - s * 0.5, p.y - s * 0.5, s, s);
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, s, 0, TAU);
            ctx.fill();
          }
        }
        ctx.restore();
      }

      const fs = G.floats;
      if (Array.isArray(fs) && fs.length) {
        ctx.save();
        ctx.font = 'bold 15px "Microsoft YaHei", "PingFang SC", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
        for (let i = 0; i < fs.length; i++) {
          const f = fs[i];
          // 前半段全不透明，后半段线性淡出
          const a = f.maxLife > 0 ? clamp(f.life / (f.maxLife * 0.5), 0, 1) : 1;
          ctx.globalAlpha = a;
          ctx.fillStyle = f.color || '#ffffff';
          ctx.strokeText(f.text, f.x, f.y);
          ctx.fillText(f.text, f.x, f.y);
        }
        ctx.restore();
      }
    },
  };

  // =====================================================================
  //  WV.audio —— WebAudio 纯合成，零外部文件
  // =====================================================================
  const LS_KEY = 'wvc-muted';
  const MASTER = 0.42;          // 总音量克制

  let actx = null;              // AudioContext 实例
  let master = null;            // 总音量节点
  let muted = readMuted();      // 静音状态
  let noiseBuf = null;

  function readMuted() {
    try {
      if (typeof localStorage === 'undefined' || !localStorage) return false;
      const v = localStorage.getItem(LS_KEY);
      return v === '1' || v === 'true';
    } catch (e) {
      return false;
    }
  }

  function writeMuted(v) {
    try {
      if (typeof localStorage === 'undefined' || !localStorage) return;
      localStorage.setItem(LS_KEY, v ? '1' : '0');
    } catch (e) { /* 隐私模式等，忽略 */ }
  }

  function ctorOf() {
    try {
      if (typeof AudioContext !== 'undefined' && typeof AudioContext === 'function') return AudioContext;
      if (root && typeof root.AudioContext === 'function') return root.AudioContext;
      if (root && typeof root.webkitAudioContext === 'function') return root.webkitAudioContext;
    } catch (e) { /* ignore */ }
    return null;
  }

  function dest() {
    return master || (actx ? actx.destination : null);
  }

  function nowT() {
    return actx ? actx.currentTime : 0;
  }

  // 音量包络：0.0001 起，attack 到 peak，dur 内指数收尾
  function env(t0, peak, attack, dur) {
    const g = actx.createGain();
    const p = Math.max(0.0002, peak);
    const a = Math.max(0.001, Math.min(attack, dur * 0.5));
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(p, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(dur, a + 0.01));
    const out = dest();
    if (out) g.connect(out);
    return g;
  }

  // 单振荡器短音
  function tone(type, f0, f1, dur, peak, t0, attack) {
    if (!actx) return;
    const t = typeof t0 === 'number' ? t0 : nowT();
    const f = Math.max(20, num(f0, 440));
    const o = actx.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    const end = Math.max(20, num(f1, f));
    if (end !== f) o.frequency.exponentialRampToValueAtTime(end, t + dur);
    o.connect(env(t, peak, num(attack, 0.01), dur));
    o.start(t);
    o.stop(t + dur + 0.03);
  }

  // 噪声源（懒创建，0.4s 白噪声循环用）
  function noiseBuffer() {
    if (noiseBuf || !actx) return noiseBuf;
    try {
      const len = Math.max(1, Math.floor(actx.sampleRate * 0.4));
      const buf = actx.createBuffer(1, len, actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      noiseBuf = buf;
    } catch (e) {
      noiseBuf = null;
    }
    return noiseBuf;
  }

  // 带滤波的噪声爆发
  function noiseHit(dur, peak, type, fFrom, fTo, t0) {
    if (!actx) return;
    const buf = noiseBuffer();
    if (!buf) return;
    const t = typeof t0 === 'number' ? t0 : nowT();
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    let node = src;
    let filter = null;
    if (typeof actx.createBiquadFilter === 'function') {
      filter = actx.createBiquadFilter();
      filter.type = type || 'lowpass';
      filter.frequency.setValueAtTime(Math.max(40, num(fFrom, 1200)), t);
      const to = Math.max(40, num(fTo, num(fFrom, 1200)));
      if (to !== num(fFrom, 1200)) {
        filter.frequency.exponentialRampToValueAtTime(to, t + dur);
      }
      filter.Q.value = 1;
      src.connect(filter);
      node = filter;
    }
    node.connect(env(t, peak, 0.008, dur));
    src.start(t);
    src.stop(t + dur + 0.02);
  }

  // 小音阶
  function arp(notes, step, peak, t0, type) {
    const t = typeof t0 === 'number' ? t0 : nowT();
    for (let i = 0; i < notes.length; i++) {
      tone(type, notes[i], notes[i], step * 0.95, peak, t + i * step, 0.006);
    }
  }

  // 12 个音效：全部振荡器 / 噪声合成
  const SOUNDS = {
    // 玩家开火：短促下滑 electronic blip
    shoot: function (t) {
      tone('triangle', 660, 300, 0.075, 0.06, t, 0.004);
      noiseHit(0.03, 0.02, 'highpass', 2200, 1600, t);
    },
    // 跳弹：高频金属「叮」
    ricochet: function (t) {
      tone('sine', 2100, 2600, 0.05, 0.038, t, 0.002);
      tone('triangle', 1500, 2300, 0.075, 0.03, t + 0.018, 0.004);
    },
    // 命中：闷响 + 短噪声
    hit: function (t) {
      noiseHit(0.05, 0.055, 'bandpass', 1400, 700, t);
      tone('square', 200, 120, 0.06, 0.032, t, 0.002);
    },
    // 击毁：下滑方波 + 碎屑噪声
    kill: function (t) {
      tone('square', 380, 110, 0.14, 0.05, t, 0.004);
      noiseHit(0.12, 0.055, 'lowpass', 1400, 300, t);
    },
    // 爆炸：低频噪声 + 次低频
    explode: function (t) {
      noiseHit(0.36, 0.12, 'lowpass', 1100, 90, t);
      tone('sine', 120, 40, 0.3, 0.075, t, 0.006);
      tone('triangle', 70, 35, 0.38, 0.05, t + 0.012);
    },
    // 玩家受击：下行锯齿 + 噪声
    playerHit: function (t) {
      tone('sawtooth', 320, 70, 0.32, 0.075, t, 0.006);
      noiseHit(0.28, 0.075, 'lowpass', 900, 160, t);
    },
    // 强化：上行琶音
    powerup: function (t) {
      arp([523, 659, 784, 1047], 0.07, 0.048, t, 'triangle');
    },
    // 选卡：两声轻脆 UI 音
    card: function (t) {
      arp([740, 1100], 0.055, 0.038, t, 'sine');
    },
    // 开局：三音上行
    start: function (t) {
      arp([392, 523, 659], 0.1, 0.052, t, 'triangle');
    },
    // 胜利：四音欢快
    win: function (t) {
      arp([523, 659, 784, 1047], 0.13, 0.058, t, 'triangle');
    },
    // 失败：四音下行
    lose: function (t) {
      arp([392, 311, 262, 196], 0.16, 0.058, t, 'sine');
    },
    // BOSS 登场：低频锯齿咆哮
    boss: function (t) {
      tone('sawtooth', 140, 55, 0.7, 0.08, t, 0.02);
      tone('square', 70, 48, 0.85, 0.048, t + 0.03, 0.02);
      noiseHit(0.7, 0.04, 'lowpass', 400, 80, t);
    },
  };

  const SOUND_NAMES = Object.keys(SOUNDS);

  function init() {
    if (actx) {
      if (actx.state === 'suspended' && typeof actx.resume === 'function') {
        try {
          const p = actx.resume();
          if (p && typeof p.catch === 'function') p.catch(function () {});
        } catch (e) { /* ignore */ }
      }
      return actx;
    }
    const Ctor = ctorOf();
    if (!Ctor) return null;             // 无音频环境：静默降级
    try {
      actx = new Ctor();
    } catch (e) {
      actx = null;
      return null;
    }
    try {
      master = actx.createGain();
      master.gain.value = muted ? 0 : MASTER;
      if (actx.destination) master.connect(actx.destination);
    } catch (e) {
      master = null;
    }
    if (actx.state === 'suspended' && typeof actx.resume === 'function') {
      try {
        const p = actx.resume();
        if (p && typeof p.catch === 'function') p.catch(function () {});
      } catch (e) { /* ignore */ }
    }
    return actx;
  }

  function play(name) {
    if (typeof name !== 'string' || !name) return;
    if (!Object.prototype.hasOwnProperty.call(SOUNDS, name)) return;  // 名字不存在静默
    if (muted) return;
    if (!actx) init();                 // 首次播放自动补一次 init（无环境则直接返回）
    if (!actx || actx.state === 'closed') return;
    if (actx.state === 'suspended' && typeof actx.resume === 'function') {
      try {
        const p = actx.resume();
        if (p && typeof p.catch === 'function') p.catch(function () {});
      } catch (e) { /* ignore */ }
    }
    try {
      SOUNDS[name](nowT() + 0.001);
    } catch (e) { /* 音频图异常不影响游戏 */ }
  }

  function toggle() {
    muted = !muted;
    writeMuted(muted);
    if (master && actx) {
      try {
        const t = actx.currentTime;
        if (master.gain.cancelScheduledValues) master.gain.cancelScheduledValues(t);
        if (master.gain.setTargetAtTime) {
          master.gain.setTargetAtTime(muted ? 0 : MASTER, t, 0.02);
        } else {
          master.gain.value = muted ? 0 : MASTER;
        }
      } catch (e) {
        try { master.gain.value = muted ? 0 : MASTER; } catch (e2) { /* ignore */ }
      }
    }
    return muted;
  }

  const AUDIO = {
    init: init,
    play: play,
    toggle: toggle,
  };
  Object.defineProperty(AUDIO, 'names', {  // 只读参考，方便联调
    get: function () { return SOUND_NAMES.slice(); },
    enumerable: true,
    configurable: false,
  });
  WV.audio = AUDIO;
  Object.defineProperty(WV.audio, 'muted', {
    get: function () { return muted; },
    enumerable: true,
    configurable: false,
  });
})(typeof window !== 'undefined' ? window : globalThis);
