<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>豆豆大挑战</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="title">豆豆大挑战</h1>
      <div class="stats">
        <span id="level-label">第 1 关</span>
        <span id="moves-label">步数: 0</span>
        <span id="timer-label">时间: 0s</span>
      </div>
      <div class="header-actions">
        <button id="btn-sound" type="button" class="btn-sound" aria-label="音效开关" title="音效">🔊</button>
        <button id="btn-menu" type="button" class="btn-menu hidden">选关</button>
      </div>
    </header>

    <section id="level-select" class="level-select" aria-label="选择关卡">
      <div class="mode-select" role="group" aria-label="游戏模式">
        <p class="mode-select-title">选择模式</p>
        <div id="mode-list" class="mode-list"></div>
      </div>
      <p id="level-select-hint" class="level-select-hint">每局随机抽取表情包并洗牌，选关开始</p>
      <div id="level-list" class="level-list"></div>
    </section>

    <div id="board-viewport" class="board-viewport hidden" aria-hidden="true">
      <div id="board-scaler" class="board-scaler">
        <main id="board" class="board" aria-label="游戏棋盘"></main>
      </div>
    </div>

    <p id="error-msg" class="error-msg hidden"></p>
  </div>

  <div id="overlay" class="overlay hidden" aria-hidden="true">
    <div class="modal">
      <h2 id="overlay-title">过关!</h2>
      <p id="overlay-text"></p>
      <div class="modal-actions">
        <button id="btn-replay" type="button">再玩一次</button>
        <button id="btn-next" type="button" class="primary">下一关</button>
        <button id="btn-select" type="button">选关</button>
      </div>
    </div>
  </div>

  <script src="js/difficulty.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/levels-data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
