<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>豆豆单词塔</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage">
  <canvas id="game"></canvas>

  <a class="hub-back" href="../../index.html">← 游戏库</a>

  <header class="topbar">
    <button class="pause" id="pause" type="button" aria-label="暂停">
      <i></i><i></i>
    </button>
    <div class="stage-name" id="stageName">豆豆单词塔 · 第 1 波</div>
  </header>

  <!-- 底部：塔血 + 等级经验 -->
  <div class="bars">
    <div class="bar hp">
      <div class="bar-fill hp-fill" id="hpFill"></div>
    </div>
    <div class="bar exp">
      <div class="bar-fill exp-fill" id="expFill"></div>
      <span class="lv" id="lv">Lv.1</span>
    </div>
  </div>

  <div class="hint" id="hint">击杀攒经验 → 升级选卡 → 补全单词才拿得到</div>

  <!-- 升级选卡面板：打开即暂停 -->
  <div class="cards" id="cards" hidden>
    <div class="cards-card">
      <p class="cards-k" id="cardsK">升级 Lv.2</p>
      <p class="cards-tip" id="cardsTip">三选一 · 补全单词才能拿到</p>

      <div class="card-list" id="cardList"></div>

      <div class="puzzle" id="puzzle" hidden>
        <p class="puzzle-name" id="puzzleName">强化弹头</p>
        <p class="puzzle-zh" id="puzzleZh">火</p>
        <div class="puzzle-word" id="puzzleWord"></div>
        <div class="puzzle-letters" id="puzzleLetters"></div>
        <p class="puzzle-tip" id="puzzleTip">拼错这张卡就没了</p>
      </div>
    </div>
  </div>

  <!-- 结算 -->
  <div class="over" id="over" hidden>
    <div class="over-card">
      <p class="over-k" id="overK">失守</p>
      <h2 class="over-title" id="overTitle">豆豆塔被推平了</h2>
      <p class="over-sub" id="overSub"></p>
      <button class="over-btn" id="again" type="button">再来一次</button>
    </div>
  </div>
</div>

<script src="words.js"></script>
<script src="game.js"></script>
</body>
</html>
