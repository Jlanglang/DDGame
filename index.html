<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16213e">
  <meta name="description" content="表情包记忆配对小游戏">
  <link rel="apple-touch-icon" href="assets/tiles/1.png">
  <title>豆豆大挑战</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      if (location.protocol === 'http:' || location.protocol === 'https:') {
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = 'manifest.json';
        document.head.appendChild(link);
      }
    })();
  </script>
</head>
<body>
  <div id="combo-toast" class="combo-toast hidden" aria-live="polite"></div>
  <div id="app" class="app-shell">
    <section id="home-page" class="page page--home" aria-label="首页">
      <header class="home-header">
        <h1 class="home-title"><span class="home-title-icon" aria-hidden="true">🫘</span>豆豆大挑战</h1>
        <button id="btn-sound" type="button" class="btn-sound" aria-label="音效开关" title="音效">🔊</button>
      </header>
      <div id="home-menu" class="home-menu">
        <p id="home-hint" class="home-hint">选关或快速开始 · 每局随机表情包</p>
        <div class="mode-select" role="group" aria-label="游戏模式">
          <p class="mode-select-title">游戏模式</p>
          <div id="mode-list" class="mode-list"></div>
        </div>
        <div id="daily-card" class="daily-card hidden"></div>
        <div class="home-actions">
          <button type="button" id="btn-quick-start" class="home-btn home-btn--primary">快速开始</button>
          <button type="button" id="btn-pick-level" class="home-btn">选关</button>
        </div>
        <div class="home-toolbar">
          <button type="button" id="btn-achievements" class="toolbar-btn">成就</button>
          <button type="button" id="btn-backpack" class="toolbar-btn">背包</button>
          <button type="button" id="btn-lottery-log" class="toolbar-btn">抽奖记录</button>
        </div>
      </div>
      <section id="sub-panel" class="sub-panel hidden" aria-hidden="true">
        <div class="sub-panel-head">
          <h2 id="sub-panel-title"></h2>
          <button type="button" id="btn-sub-back" class="toolbar-btn">返回</button>
        </div>
        <div id="sub-panel-body" class="sub-panel-body"></div>
      </section>
      <p id="error-msg" class="error-msg hidden"></p>
    </section>
    <section id="game-page" class="page page--game hidden" aria-label="游戏" aria-hidden="true">
      <header class="header game-header">
        <div id="combo-hud" class="combo-hud hidden">连击 x0</div>
        <div class="stats">
          <span id="level-label">第 1 关</span>
          <span id="moves-label">步数: 0</span>
          <span id="timer-label">时间: 0s</span>
        </div>
        <div class="header-actions">
          <button id="btn-hint" type="button" class="btn-hint hidden" title="提示">💡<span id="hint-count"></span></button>
          <button id="btn-sound-game" type="button" class="btn-sound" aria-label="音效开关" title="音效">🔊</button>
          <button id="btn-menu" type="button" class="btn-menu">选关</button>
          <button id="btn-home" type="button" class="btn-home">首页</button>
        </div>
      </header>
      <p id="drop-rate-hud" class="drop-rate-hud hidden" aria-live="polite"></p>
      <div id="board-viewport" class="board-viewport">
        <div id="preview-overlay" class="preview-overlay hidden" aria-hidden="true" aria-live="polite">
          <div class="preview-overlay-banner">
            <p class="preview-overlay-label">记住牌面</p>
            <p id="preview-overlay-count" class="preview-overlay-count">3</p>
          </div>
        </div>
        <div id="board-scaler" class="board-scaler">
          <main id="board" class="board" aria-label="游戏棋盘"></main>
        </div>
      </div>
    </section>
  </div>
  <div id="level-picker" class="level-picker hidden" aria-hidden="true">
    <div class="level-picker-sheet" role="dialog" aria-labelledby="level-picker-title">
      <div class="level-picker-head">
        <h2 id="level-picker-title">选择关卡</h2>
        <button type="button" id="btn-level-picker-close" class="level-picker-close" aria-label="关闭">×</button>
      </div>
      <p id="level-select-hint" class="level-select-hint"></p>
      <div id="level-list" class="level-list"></div>
    </div>
  </div>
  <div id="synth-picker" class="level-picker synth-picker hidden" aria-hidden="true">
    <div class="level-picker-sheet synth-picker-sheet" role="dialog" aria-labelledby="synth-picker-title">
      <div class="level-picker-head">
        <h2 id="synth-picker-title">选择合成卡片</h2>
        <button type="button" id="btn-synth-picker-close" class="level-picker-close" aria-label="关闭">×</button>
      </div>
      <p id="synth-picker-hint" class="level-select-hint synth-picker-hint"></p>
      <div id="synth-picker-list" class="synth-picker-list"></div>
    </div>
  </div>
  <div id="lottery-picker" class="level-picker lottery-picker hidden" aria-hidden="true">
    <div class="level-picker-sheet lottery-picker-sheet" role="dialog" aria-labelledby="lottery-picker-title">
      <div class="level-picker-head">
        <h2 id="lottery-picker-title">选择抽奖卡片</h2>
        <button type="button" id="btn-lottery-picker-close" class="level-picker-close" aria-label="关闭">×</button>
      </div>
      <p id="lottery-picker-hint" class="level-select-hint lottery-picker-hint"></p>
      <div id="lottery-picker-list" class="lottery-picker-list"></div>
    </div>
  </div>
  <div id="lottery-result" class="level-picker lottery-result hidden" aria-hidden="true">
    <div class="level-picker-sheet lottery-result-sheet" role="dialog" aria-labelledby="lottery-result-title">
      <div class="lottery-result-body">
        <span id="lottery-result-emoji" class="lottery-result-emoji" aria-hidden="true">🎀</span>
        <span id="lottery-result-tag" class="lottery-result-tag lottery-result-tag--reward">正向奖励</span>
        <h2 id="lottery-result-title" class="lottery-result-title"></h2>
        <p id="lottery-result-desc" class="lottery-result-desc"></p>
        <p class="lottery-result-hint">记得给家长看，按约定兑现哦～</p>
        <button type="button" id="btn-lottery-result-close" class="home-btn home-btn--primary">收下</button>
      </div>
    </div>
  </div>
  <div id="overlay" class="overlay hidden" aria-hidden="true">
    <div id="achievement-pop" class="achievement-pop hidden"></div>
    <div class="modal">
      <h2 id="overlay-title">过关!</h2>
      <p id="overlay-text"></p>
      <div id="overlay-drops" class="overlay-drops hidden" aria-hidden="true"></div>
      <div class="modal-actions">
        <button id="btn-share" type="button" class="hidden">分享成绩</button>
        <button id="btn-replay" type="button">再玩一次</button>
        <button id="btn-overlay-close" type="button" class="hidden">关闭</button>
        <button id="btn-next" type="button" class="primary">下一关</button>
        <button id="btn-select" type="button">选关</button>
      </div>
    </div>
  </div>
  <script src="js/difficulty.js"></script>
  <script src="js/rarity.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/lottery-rewards.js"></script>
  <script src="js/backpack.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/levels-data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
