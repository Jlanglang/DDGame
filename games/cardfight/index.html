<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡牌战斗 · 关卡</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0a0810;
    color: #f4e7d2;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #app {
    position: absolute; left: 50%; top: 50%;
    width: 1280px; height: 720px; overflow: hidden;
    transform-origin: center center;
    background: radial-gradient(120% 90% at 50% 0%, #2a2143 0%, #1a1220 55%, #0d0a12 100%);
    box-shadow: 0 0 80px rgba(0, 0, 0, 0.85);
  }
  .glow {
    position: absolute; left: 50%; top: -180px; width: 900px; height: 520px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(255, 190, 120, 0.18), transparent 65%);
    pointer-events: none;
  }
  header {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px 34px 10px;
  }
  .brand { display: flex; align-items: baseline; gap: 14px; }
  .brand h1 { margin: 0; font-size: 26px; letter-spacing: 0.18em; color: #f6e2bb; }
  .brand small { font-size: 11px; letter-spacing: 0.24em; color: #8f7d67; }
  .progress {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; border-radius: 999px;
    border: 1px solid rgba(207, 169, 111, 0.3);
    background: rgba(14, 10, 16, 0.7);
    font-size: 12px; color: #c8ae86;
  }
  .progress b { color: #ffd166; font-size: 15px; }
  .hub { margin-left: 14px; font-size: 11px; letter-spacing: 0.08em; color: #8f7d67; text-decoration: none; }
  .hub:hover { color: #ffd166; }
  .head-right { display: flex; align-items: center; }

  .layout {
    position: relative; z-index: 2;
    display: grid; grid-template-columns: 1fr 268px;
    gap: 22px; padding: 8px 34px 26px;
    height: calc(100% - 96px);
  }
  .panel {
    border-radius: 16px;
    border: 1px solid rgba(207, 169, 111, 0.18);
    background: linear-gradient(180deg, rgba(28, 21, 32, 0.86), rgba(14, 10, 18, 0.9));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
  }
  .levels { padding: 16px 18px; overflow: auto; }
  .levels h2, .team h2 {
    margin: 0 0 12px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.2em; color: #b99a6d;
  }
  .level-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
  }
  .lv {
    position: relative;
    padding: 12px 12px 10px;
    border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(207, 169, 111, 0.22);
    background: linear-gradient(180deg, rgba(46, 33, 40, 0.9), rgba(22, 16, 22, 0.92));
    transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
  }
  .lv:hover { transform: translateY(-2px); border-color: rgba(255, 209, 102, 0.45); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
  .lv .no { font-size: 20px; font-weight: 800; color: #f2ddb8; letter-spacing: 0.04em; }
  .lv .nm { margin-top: 2px; font-size: 10px; color: #9f8d75; letter-spacing: 0.06em; }
  .lv .cnt { margin-top: 8px; font-size: 10px; color: #8f7d67; }
  .lv .mark {
    position: absolute; right: 9px; top: 9px; font-size: 11px;
  }
  .lv.cleared { border-color: rgba(142, 224, 143, 0.35); }
  .lv.cleared .mark { color: #8ee08f; }
  .lv.locked { opacity: 0.45; cursor: not-allowed; filter: grayscale(0.4); }
  .lv.locked .mark { color: #7f7162; }
  .lv.current { border-color: rgba(255, 209, 102, 0.75); box-shadow: 0 0 0 1px rgba(255, 209, 102, 0.25), 0 0 24px rgba(255, 209, 102, 0.16); }

  .team { padding: 16px 16px 14px; display: flex; flex-direction: column; }
  .team-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .hero-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 10px;
    border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.02);
    text-decoration: none; color: inherit; cursor: pointer;
    box-shadow: 0 0 calc(var(--qglow-r, 8px) * 0.6) var(--qglow, transparent);
    transition: background 0.12s, transform 0.12s, box-shadow 0.12s;
  }
  .hero-row:hover { background: rgba(255, 255, 255, 0.05); transform: translateX(2px); box-shadow: 0 0 var(--qglow-r, 8px) var(--qglow, transparent); }
  .hero-row .arrow { font-size: 16px; color: #7f7162; margin-left: 4px; }
  .hero-row .thumb {
    width: 42px; height: 56px; flex: 0 0 42px; border-radius: 8px;
    background-color: rgba(255, 255, 255, 0.04);
    background-size: 200% auto;
    background-position: 50% 6%;
    background-repeat: no-repeat;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }
  .hero-row .meta { flex: 1; min-width: 0; }
  .hero-row .nm { font-size: 13px; font-weight: 700; }
  .hero-row .pos { font-size: 10px; color: #b99a6d; margin-top: 2px; }
  .btn.link { display: grid; place-items: center; text-decoration: none; }
  .team-actions .btn { font-family: inherit; }
  .team-actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .btn {
    height: 42px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(217, 176, 106, 0.45);
    background: linear-gradient(180deg, rgba(63, 38, 28, 0.94), rgba(34, 20, 16, 0.94));
    color: #f2ddb8; font: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.14em;
  }
  .btn.primary { background: linear-gradient(180deg, #dfb15f, #a76a2e); border-color: #f4d494; color: #24130a; }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: 0.4; cursor: default; }
  .tip { margin-top: 10px; font-size: 10px; line-height: 1.7; color: #7f7162; }

  /* ---------- 布阵层 ---------- */
  #editor[hidden] { display: none; }
  #editor {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    background: rgba(6, 4, 10, 0.86);
    backdrop-filter: blur(8px);
  }
  .ed-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 34px 6px;
  }
  .ed-head h2 { margin: 0; font-size: 20px; letter-spacing: 0.14em; color: #f6e2bb; }
  .ed-head small { display: block; margin-top: 4px; font-size: 11px; color: #8f7d67; letter-spacing: 0.08em; }
  .ed-body { flex: 1; display: flex; align-items: center; justify-content: center; }
  .board {
    position: relative; width: 780px; height: 439px;
    border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(207, 169, 111, 0.22);
    background: radial-gradient(120% 100% at 50% 0%, #2a2143 0%, #1a1220 60%, #100c16 100%);
  }
  .board-stage {
    position: absolute; left: 0; top: 0;
    width: 1280px; height: 720px;
    transform-origin: 0 0;
    transform: scale(0.609375);
  }
  .board-floor {
    position: absolute; left: 640px; top: 592px;
    width: 1040px; height: 336px; margin: -168px 0 0 -520px;
    border-radius: 50%;
    border: 1px solid rgba(200, 160, 110, 0.35);
    background: radial-gradient(ellipse at 50% 45%, rgba(61, 50, 64, 0.95), rgba(26, 18, 26, 0.9) 70%);
    box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5);
  }
  .board-floor::before, .board-floor::after {
    content: ""; position: absolute; border-radius: 50%;
    border: 1px solid rgba(200, 160, 110, 0.22);
  }
  .board-floor::before { inset: 44px 60px; }
  .board-floor::after { inset: 96px 132px; }

  .slot {
    position: absolute; transform: translate(-50%, 50%);
    border-radius: 50%;
    border: 1px dashed rgba(160, 190, 230, 0.4);
    background: radial-gradient(ellipse, rgba(80, 130, 210, 0.12), transparent 70%);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: rgba(190, 210, 240, 0.6);
    transition: box-shadow 0.12s, border-color 0.12s;
  }
  .slot.hot { border-color: #ffd166; box-shadow: 0 0 0 2px rgba(255, 209, 102, 0.35), 0 0 24px rgba(255, 209, 102, 0.35); }
  .slot.filled { border-style: solid; border-color: rgba(255, 209, 102, 0.35); }

  .bunit {
    position: absolute; transform: translateX(-50%);
    cursor: grab; touch-action: none;
  }
  .bunit img { display: block; height: 100%; width: auto; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.55)); }
  .bunit .tag {
    position: absolute; left: 50%; bottom: calc(100% + 3px); transform: translateX(-50%);
    padding: 1px 6px; border-radius: 4px; white-space: nowrap;
    font-size: 9px; color: #f1dfc2;
    background: rgba(18, 13, 18, 0.9);
    border: 1px solid rgba(206, 166, 104, 0.5);
  }
  .bunit.dragging { opacity: 0.35; }

  .tray {
    display: flex; gap: 14px; align-items: center; justify-content: center;
    padding: 6px 0 0;
  }
  .tray-card {
    position: relative; width: 92px; padding: 8px 8px 10px;
    border-radius: 12px; text-align: center; cursor: grab;
    border: 1px solid var(--qline, rgba(207, 169, 111, 0.28));
    background: linear-gradient(180deg, rgba(44, 32, 38, 0.95), rgba(20, 14, 20, 0.95));
    touch-action: none;
  }
  .tray-card img { height: 74px; width: auto; display: block; margin: 0 auto 4px; pointer-events: none; }
  .tray-card .nm { font-size: 11px; font-weight: 700; color: var(--qc, #f2ddb8); pointer-events: none; }
  .tray-card .used { font-size: 9px; color: #8f7d67; margin-top: 2px; pointer-events: none; }
  .tray-card.placed { border-color: rgba(142, 224, 143, 0.4); }

  .ed-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 34px 22px;
  }
  .ed-note { font-size: 11px; color: #8f7d67; letter-spacing: 0.04em; }
  .ed-actions { display: flex; gap: 10px; }
  .ed-actions .btn { min-width: 120px; }

  #ghost {
    position: fixed; z-index: 60; pointer-events: none;
    transform: translate(-50%, -100%);
    filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.6));
  }
  #ghost img { display: block; }
  #ghost .cap {
    margin-top: 2px; text-align: center; font-size: 10px; color: #ffe0a3;
    text-shadow: 0 2px 6px #000;
  }
</style>
</head>
<body>
<div id="app">
  <div class="glow"></div>

  <header>
    <div class="brand">
      <h1>卡牌战斗</h1>
      <small>STAGE SELECT</small>
    </div>
    <div class="head-right">
      <div class="progress">等级 <b id="lvText">Lv.0</b></div>
      <div class="progress">金币 <b id="goldText">0</b></div>
      <div class="progress">进度 <b id="progText">0 / 20</b></div>
      <a class="hub" href="../../index.html">游戏库</a>
    </div>
  </header>

  <div class="layout">
    <section class="panel levels">
      <h2>关卡</h2>
      <div class="level-grid" id="levelGrid"></div>
    </section>

    <aside class="panel team">
      <h2>出战队伍</h2>
      <div class="team-list" id="teamList"></div>
      <div class="team-actions">
        <button class="btn primary" id="btnBattle" type="button">出 战</button>
        <button class="btn" id="btnFormation" type="button">布 阵</button>
        <a class="btn link" href="heroes.html">英雄池</a>
      </div>
      <div class="tip">点队伍里的英雄看详情。<br>布阵只能在主页面做，保存后战斗照着摆。</div>
    </aside>
  </div>

  <!-- 布阵层 -->
  <div id="editor" hidden>
    <div class="ed-head">
      <div>
        <h2>布 阵</h2>
        <small>把下面的英雄拖到圈里；拖已上场的英雄到别的圈可以换位</small>
      </div>
      <div class="ed-note" id="edLevel">敌方：—</div>
    </div>
    <div class="ed-body">
      <div class="board" id="board">
        <div class="board-stage" id="boardStage">
          <div class="board-floor"></div>
          <div id="boardSlots"></div>
          <div id="boardUnits"></div>
        </div>
      </div>
    </div>
    <div class="tray" id="tray"></div>
    <div class="ed-foot">
      <div class="ed-note">位置规则：1/2 前排、3/4/5 后排；1、3 是锚点，其余按左切面推</div>
      <div class="ed-actions">
        <button class="btn" id="btnCancel" type="button">取 消</button>
        <button class="btn primary" id="btnSave" type="button">保 存</button>
      </div>
    </div>
  </div>
</div>

<script src="formation.js"></script>
<script src="levels.js"></script>
<script src="heroes.js"></script>
<script src="economy.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var board = document.getElementById('board');
  var boardStage = document.getElementById('boardStage');
  var boardSlots = document.getElementById('boardSlots');
  var boardUnits = document.getElementById('boardUnits');
  var tray = document.getElementById('tray');

  var currentLevel = Math.min(CF.nextUncleared(), CF.LEVELS.length);
  var formation = CF.loadFormation();
  var draft = null;         // 布阵中的临时阵容
  var drag = null;          // { hero, fromSlot, ghost }

  function fit() {
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    app.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ---------------- 关卡列表 ---------------- */
  function renderLevels() {
    var grid = document.getElementById('levelGrid');
    var prog = CF.loadProgress();
    grid.innerHTML = '';
    CF.LEVELS.forEach(function (lv) {
      var cleared = prog.cleared.indexOf(lv.id) >= 0;
      var unlocked = CF.isUnlocked(lv.id);
      var d = document.createElement('div');
      d.className = 'lv' + (cleared ? ' cleared' : '') + (unlocked ? '' : ' locked') +
        (lv.id === currentLevel ? ' current' : '');
      d.innerHTML =
        '<div class="no">' + String(lv.id).padStart(2, '0') + '</div>' +
        '<div class="nm">' + lv.name + '</div>' +
        '<div class="cnt">敌方 ' + lv.enemies.length + ' 人</div>' +
        '<div class="mark">' + (cleared ? '★' : unlocked ? '' : '🔒') + '</div>';
      d.addEventListener('click', function () {
        if (!unlocked) return;
        currentLevel = lv.id;
        renderLevels();
        renderTeam();
      });
      d.addEventListener('dblclick', function () {
        if (unlocked) location.href = 'battle.html?level=' + lv.id;
      });
      grid.appendChild(d);
    });
    var clearedCount = prog.cleared.length;
    document.getElementById('progText').textContent = clearedCount + ' / ' + CF.LEVELS.length;
  }

  /* ---------------- 队伍 ---------------- */
  function renderTeam() {
    var list = document.getElementById('teamList');
    list.innerHTML = '';
    formation.slice().sort(function (a, b) { return a.slot - b.slot; }).forEach(function (it) {
      var h = CF.HEROES[it.hero];
      var db = (window.HERO_DB && HERO_DB[it.hero]) || { q: 'A', lv: 1 };
      var hl = window.ECO ? ECO.levelOf(it.hero) : db.lv;
      var row = document.createElement('a');
      row.className = 'hero-row q-edge q-' + db.q;
      row.href = 'hero.html?id=' + it.hero;
      row.innerHTML =
        '<span class="thumb" style="background-image:url(\'' + (db.face || h.img) + '\')"></span>' +
        '<div class="meta"><div class="nm q-name">' + h.name + '</div>' +
        '<div class="pos">Lv.' + hl + ' · ' + it.slot + ' 号位 · ' +
          (it.slot <= 2 ? '前排' : '后排') + '</div></div>' +
        '<span class="arrow">›</span>';
      list.appendChild(row);
    });
    var lv = CF.levelById(currentLevel);
    document.getElementById('btnBattle').textContent = '出 战 · 第 ' + lv.id + ' 关';
    if (window.ECO) {
      document.getElementById('lvText').textContent = 'Lv.' + ECO.playerLevel();
      document.getElementById('goldText').textContent = ECO.gold();
    }
  }

  document.getElementById('btnBattle').addEventListener('click', function () {
    location.href = 'battle.html?level=' + currentLevel;
  });

  /* ---------------- 布阵 ---------------- */
  function openEditor() {
    draft = formation.map(function (x) { return { hero: x.hero, slot: x.slot }; });
    document.getElementById('editor').hidden = false;
    renderBoard();
    renderTray();
  }

  function closeEditor() {
    document.getElementById('editor').hidden = true;
    draft = null;
    killGhost();
  }

  function slotsOf(list) {
    var w = {};
    list.forEach(function (it) {
      if (it.slot === 1 || it.slot === 3 || it.slot === 4) w[it.slot] = CF.widthOf(it.hero);
    });
    return CF.computeSlots('player', w);
  }

  function renderBoard() {
    var pos = slotsOf(draft);
    boardSlots.innerHTML = '';
    boardUnits.innerHTML = '';
    // 敌方站位（只做预览，不可拖）
    var lv = CF.levelById(currentLevel);
    var ew = {};
    lv.enemies.forEach(function (e) {
      if (e.slot === 1 || e.slot === 3 || e.slot === 4) ew[e.slot] = CF.widthOf(e.art);
    });
    var epos = CF.computeSlots('enemy', ew);
    lv.enemies.forEach(function (e) {
      var m = CF.MONSTERS[e.art];
      var ep = epos[e.slot];
      var es = CF.depthScale(720 - ep.bottom);
      var n = document.createElement('div');
      n.className = 'bunit enemy';
      n.style.left = ep.left + 'px';
      n.style.bottom = ep.bottom + 'px';
      n.style.height = (CF.BODY_H * es) + 'px';
      n.style.opacity = '0.32';
      n.style.pointerEvents = 'none';
      n.innerHTML = '<img src="' + m.img + '" alt="" draggable="false">' +
        '<div class="tag">' + m.name + ' · ' + e.slot + '</div>';
      boardUnits.appendChild(n);
    });
    for (var no = 1; no <= 5; no += 1) {
      var p = pos[no];
      var s = CF.depthScale(720 - p.bottom);
      var d = document.createElement('div');
      d.className = 'slot';
      d.dataset.slot = no;
      d.style.left = p.left + 'px';
      d.style.bottom = p.bottom + 'px';
      d.style.width = (96 * s) + 'px';
      d.style.height = (96 * s * CF.FLOOR_RATIO) + 'px';
      d.textContent = no;
      boardSlots.appendChild(d);
    }
    draft.forEach(function (it) {
      var p = pos[it.slot];
      var h = CF.HEROES[it.hero];
      var s = CF.depthScale(720 - p.bottom);
      var el = document.createElement('div');
      el.className = 'bunit';
      el.dataset.hero = it.hero;
      el.dataset.slot = it.slot;
      el.style.left = p.left + 'px';
      el.style.bottom = p.bottom + 'px';
      el.style.height = (CF.BODY_H * s) + 'px';
      el.innerHTML = '<img src="' + h.img + '" alt="" draggable="false">' +
        '<div class="tag">' + h.name + ' · ' + it.slot + '</div>';
      el.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        startDrag(e, it.hero, it.slot);
      });
      boardUnits.appendChild(el);
    });
    var lv = CF.levelById(currentLevel);
    document.getElementById('edLevel').textContent =
      '本关敌方：' + lv.enemies.map(function (e) { return CF.MONSTERS[e.art].name + '(' + e.slot + ')'; }).join('、');
  }

  function renderTray() {
    tray.innerHTML = '';
    CF.HERO_ORDER.forEach(function (id) {
      var h = CF.HEROES[id];
      var db = (window.HERO_DB && HERO_DB[id]) || { q: 'A', lv: 1 };
      var used = draft.filter(function (x) { return x.hero === id; })[0];
      var card = document.createElement('div');
      card.className = 'tray-card q-' + db.q + (used ? ' placed' : '');
      card.innerHTML = '<img src="' + h.img + '" alt="" draggable="false">' +
        '<div class="nm q-name">' + h.name + '</div>' +
        '<div class="used">' + (used ? used.slot + ' 号位' : '未上场') + '</div>';
      card.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (used) { startDrag(e, id, used.slot); return; }
        startDrag(e, id, null);
      });
      tray.appendChild(card);
    });
  }

  /* ---------------- 拖拽 ---------------- */
  function startDrag(e, hero, fromSlot) {
    var h = CF.HEROES[hero];
    var g = document.createElement('div');
    g.id = 'ghost';
    g.innerHTML = '<img src="' + h.img + '" style="height:' + 150 + 'px">' +
      '<div class="cap">' + h.name + '</div>';
    document.body.appendChild(g);
    drag = { hero: hero, fromSlot: fromSlot, ghost: g };
    moveGhost(e.clientX, e.clientY);
    var placed = boardUnits.querySelector('.bunit[data-hero="' + hero + '"]');
    if (placed) placed.classList.add('dragging');
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    highlight(true);
  }

  function moveGhost(x, y) {
    if (!drag) return;
    drag.ghost.style.left = x + 'px';
    drag.ghost.style.top = y + 'px';
  }

  function killGhost() {
    if (drag && drag.ghost) drag.ghost.remove();
    drag = null;
    highlight(false);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }

  function onMove(e) { moveGhost(e.clientX, e.clientY); }

  function onUp(e) {
    if (!drag) return;
    var slot = slotAt(e.clientX, e.clientY);
    var hero = drag.hero;
    var from = drag.fromSlot;
    killGhost();
    if (!slot) { renderBoard(); renderTray(); return; }

    var occupant = draft.filter(function (x) { return x.slot === slot; })[0];
    if (occupant && occupant.hero === hero) { renderBoard(); renderTray(); return; }
    if (from == null) {
      // 从托盘拖进来：占位的人被挤下场
      draft = draft.filter(function (x) { return x.hero !== hero && x.slot !== slot; });
      draft.push({ hero: hero, slot: slot });
    } else {
      var self = draft.filter(function (x) { return x.hero === hero; })[0];
      if (occupant) occupant.slot = self.slot;   // 换位
      self.slot = slot;
    }
    draft = draft.filter(function (x) { return x.slot > 0; });
    renderBoard();
    renderTray();
  }

  function slotAt(clientX, clientY) {
    var rect = boardStage.getBoundingClientRect();
    var scale = rect.width / 1280;
    var wx = (clientX - rect.left) / scale;
    var wy = (clientY - rect.top) / scale;
    var pos = slotsOf(draft);
    var best = null, bestD = 1e9;
    for (var no = 1; no <= 5; no += 1) {
      var p = pos[no];
      var cx = p.left, cy = 720 - p.bottom;
      var d = Math.hypot(wx - cx, wy - cy);
      if (d < bestD) { bestD = d; best = no; }
    }
    return bestD <= 190 ? best : null;
  }

  function highlight(on) {
    Array.prototype.forEach.call(boardSlots.children, function (n) {
      n.classList.toggle('hot', !!on);
    });
  }

  document.getElementById('btnFormation').addEventListener('click', openEditor);
  document.getElementById('btnCancel').addEventListener('click', closeEditor);
  document.getElementById('btnSave').addEventListener('click', function () {
    formation = draft.map(function (x) { return { hero: x.hero, slot: x.slot }; });
    CF.saveFormation(formation);
    closeEditor();
    renderTeam();
  });

  renderLevels();
  renderTeam();
  if (/[?&]edit=1/.test(location.search)) openEditor();
})();
</script>
</body>
</html>
